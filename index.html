eki oturumu sürdürür, TERMİNAL ile gerçek terminalde açarsın.'},{title:"Ajan İstasyonun",art:"agents",body:"Sağ üstte 5 kişisel asistanın durur: ATLAS (CTO — durum raporu), NAVIGATOR (PM — takip ve hesap sorma), DOCUMENTOR (README yazar, tek yazma yetkili), FORGE (kod kalitesi, salt okur), MENTOR (öğrenme koçu). Üzerine gel → görev kartı; tıkla → görev istasyonu. Uzaydayken tüm evrene, gezegen modundayken sadece o projeye bakarlar."},{title:"Günlük & Hızlı Not",art:"log",body:'✎ GÜNLÜK ile gün içindeki notlarını yazarsın: Claude notun hangi projeye ait olduğunu bulur, KLASÖR YOLUNU göstererek onayını ister; onaylarsan yapılan iş README Günlük\'üne, yapılacak iş "Yapılacaklar" bölümüne ve plana işlenir. Uygulama kapalıyken bile ⌘⇧G ile menü çubuğundan hızlı not atarsın.'},{title:"Görev Panosu",art:"board",body:"▦ PANO tüm yapılacakları Trello tarzı üç kolonda toplar: Bekliyor / Devam Ediyor / Tamamlandı. Genel todo'ların ve tüm projelerin plan maddeleri tek ekranda. ◂ ▸ ile durum değiştir; karttaki ▸ GİT ile o projenin gezegenine in, ⌁ ile Claude terminalini aç ve işe devam et."},{title:"Uyarılar & Raporlar",art:"alert",body:"NAVIGATOR'ın rozeti bekleyen sorunları sayar: uzun süre dokunulmamış aktif projeler, birikmiş plan maddeleri. Uyarıya tıkla → projeye uç. Her Pazartesi 09:00 haftalık retro raporu hazırlanır (git aktivitesi + kapanan işler + odak süreleri); raporlar ajan panelindeki listede durur."},{title:"Güvenlik & Kısayollar",art:"keys",body:"Verin her gün otomatik yedeklenir (14 gün) ve her değişiklik git'e commit'lenir — hiçbir şey kaybolmaz. Proje silme iki aşamalı onaylıdır ve en kötü ihtimalle Çöp Kutusu'na gider. Kısayollar: ESC katman katman geri · ⌘⇧G hızlı not · Enter arama sonucuna git · çift tık gezegene in · Backspace üst klasör."}],S={cto:{duty:"Tüm evrenlerin teknik lideri. Projelerin genel sağlığını izler, yönetici bakışıyla dürüst durum raporu verir.",skills:["İş / kişisel evren durum raporları","Risk ve tıkanıklık analizi","Haftalık odak önerisi"]},navigator:{duty:"Proje yöneticin. Plan maddelerini ve taahhütlerini takip eder, unutulan işlerin hesabını sorar.",skills:["Günlük standup özeti","İhmal edilmiş projeleri yakalama","Bekleyen görev takibi"]},documentor:{duty:"Dokümantasyon uzmanın. Eksik README'leri bulur ve istersen senin yerine yazar — dosya oluşturma yetkisi olan tek ajan.",skills:["Doküman açığı tespiti","README taslağı yazma","Doküman envanteri çıkarma"]},forge:{duty:"Kod kalitesi mühendisin. Kod tabanlarını okur, teknik borcu ve hızlı kazanımları raporlar. Asla dosya değiştirmez.",skills:["Teknik borç taraması","Sağlık notu (1-10)","Kopya/ölü kod tespiti"]},mentor:{duty:"Kişisel gelişim koçun. FY'deki öğrenme ve ürün projelerini izler, gerçekçi haftalık hedefler önerir.",skills:["Haftalık çalışma planı","İlerleme değerlendirmesi","Momentum hatırlatmaları"]}},N={cto:[["İŞ RAPORU","Sadece İş Evreni (PAPILON projeleri, FY/ öneki OLMAYAN projeler) için durum raporu ver."],["KİŞİSEL RAPOR","Sadece Kişisel Evren (FY/ önekiyle başlayan projeler) için durum raporu ver."],["RİSK","Risk analizi yap: hangi projeler tıkanmış, hangileri uzun süredir dokunulmamış, neler acil?"],["ODAK","Bu hafta neye odaklanmalıyım? En yüksek etkili 3 işi seç ve nedenini açıkla."]],navigator:[["STANDUP","Bugünün standup raporunu ver: her aktif projede son durum ve TEK sonraki adım."],["İHMAL EDİLENLER","Uzun süredir dokunulmamış aktif projeleri ve birikmiş plan maddelerini listele, en acilden başla."],["TAAHHÜTLER","Bekleyen tüm plan maddelerini proje bazında listele ve hangilerinin bu hafta bitmesi gerektiğini söyle."]],documentor:[["DOKÜMAN AÇIĞI","README'si olmayan veya zayıf olan projeleri tespit et, önem sırasına göre listele."],["ENVANTER","Tüm projelerdeki mevcut dokümanları (md, pdf, docx) tara ve neyin nerede olduğunu özetle."]],forge:[["EVREN TARAMASI","Tüm projelere üstten bak ve teknik borç açısından en riskli 3 projeyi seç, gerekçeleriyle raporla."],["HIZLI KAZANIMLAR","Kod tabanlarında 1 saatten kısa sür
