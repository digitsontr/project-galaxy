<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Project Galaxy</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #02030a; }
  body { font-family: -apple-system, "SF Pro Display", "Segoe UI", sans-serif; color: #cdd6ff; user-select: none; }
  button { font-family: inherit; }
  canvas { position: fixed; inset: 0; }
  #space { cursor: grab; }
  #space.dragging { cursor: grabbing; }
  #psky { display: none; }
  body.planet #space { display: none; }
  body.planet #psky { display: block; }

  /* ================= ÜST BAR ================= */
  #topbar {
    position: fixed; top: 0; left: 0; right: 0; height: 54px;
    display: flex; align-items: center; gap: 12px; padding: 0 20px;
    background: linear-gradient(to bottom, rgba(2,3,10,.88), transparent);
    z-index: 10;
  }
  #title { font-size: 13px; letter-spacing: 4px; text-transform: uppercase; color: #7f8ec9; font-weight: 600; white-space: nowrap; }
  .chip { font-size: 12px; color: #8fa0e8; padding: 4px 12px; border: 1px solid rgba(120,140,255,.25); border-radius: 14px; white-space: nowrap; }
  #search {
    background: rgba(20,26,60,.6); border: 1px solid rgba(120,140,255,.25);
    border-radius: 20px; padding: 7px 16px; color: #e6ebff; font-size: 13px;
    width: 210px; outline: none; backdrop-filter: blur(6px);
  }
  #search:focus { border-color: rgba(120,140,255,.6); }
  .btn {
    background: rgba(20,26,60,.6); border: 1px solid rgba(120,140,255,.25);
    border-radius: 20px; padding: 7px 16px; color: #aab6f0; font-size: 12px;
    cursor: pointer; backdrop-filter: blur(6px); transition: all .15s; white-space: nowrap;
  }
  .btn:hover { border-color: rgba(120,140,255,.7); color: #fff; }
  .btn.primary { background: #3a55d4; color: #fff; border-color: transparent; }
  .btn.primary:hover { background: #4a66e8; }
  #stats { margin-left: auto; font-size: 12px; color: #5a6699; white-space: nowrap; }
  .spaceOnly { display: flex; align-items: center; gap: 12px; flex: 1; }
  body.planet .spaceOnly { display: none; }
  #planetBar { display: none; align-items: center; gap: 10px; flex: 1; min-width: 0; }
  body.planet #planetBar { display: flex; }
  #crumbs { display: flex; align-items: center; gap: 4px; font-size: 13px; overflow: hidden; }
  .crumb { color: #8fa0e8; cursor: pointer; white-space: nowrap; padding: 3px 8px; border-radius: 8px; }
  .crumb:hover { background: rgba(120,140,255,.15); color: #fff; }
  .crumb.here { color: #fff; font-weight: 600; }
  .crumbSep { color: #4a5480; }
  #planetChip { margin-left: auto; }

  /* ================= ALT BİLGİ ================= */
  #legend {
    position: fixed; bottom: 16px; left: 20px; z-index: 10;
    font-size: 11px; color: #6b76a8; display: flex; gap: 14px;
  }
  #legend span::before {
    content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin-right: 6px; background: var(--c); box-shadow: 0 0 6px var(--c);
  }
  body.planet #legend { display: none; }
  #hint { position: fixed; bottom: 16px; right: 240px; z-index: 10; font-size: 11px; color: #4a5480; text-align: right; }
  body.planet #hint { right: 20px; }

  /* ================= TOOLTIP ================= */
  #tip {
    position: fixed; pointer-events: none; z-index: 25; padding: 8px 14px;
    background: rgba(8,12,32,.92); border: 1px solid rgba(120,140,255,.3);
    border-radius: 10px; font-size: 12px; display: none; backdrop-filter: blur(8px); max-width: 320px;
  }
  #tip b { color: #fff; display: block; font-size: 13px; }
  #tip small { color: #8fa0e8; }

  /* ================= MİNİMAP ================= */
  #minimap {
    position: fixed; right: 16px; bottom: 16px; width: 200px; height: 140px;
    border: 1px solid rgba(120,140,255,.25); border-radius: 12px;
    background: rgba(5,8,22,.75); backdrop-filter: blur(8px); z-index: 10; cursor: pointer;
  }
  body.planet #minimap { display: none; }

  /* ================= BİLGİ KARTI (uzay) ================= */
  #card {
    position: fixed; z-index: 18; width: 320px; display: none;
    background: linear-gradient(165deg, rgba(14,19,48,.95), rgba(6,9,26,.97));
    border: 1px solid rgba(120,140,255,.35); border-radius: 18px;
    padding: 18px 20px; backdrop-filter: blur(14px);
    box-shadow: 0 18px 60px rgba(0,0,0,.5);
  }
  #card .cGroup { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: #6b76a8; }
  #card .cName { font-size: 19px; font-weight: 700; color: #f0f3ff; margin: 2px 0 6px; }
  #card .cStage { font-size: 12px; color: #aab6f0; margin-bottom: 10px; }
  #card .cDesc { font-size: 12px; color: #8b93b8; line-height: 1.5; margin-bottom: 12px; max-height: 72px; overflow: hidden; }
  #card .bar { height: 5px; border-radius: 3px; background: rgba(120,140,255,.15); margin-bottom: 14px; overflow: hidden; }
  #card .bar i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, #4d7bff, #7fd4ff); }
  #card .cBtns { display: flex; gap: 8px; }
  #card .cBtns .btn { flex: 1; text-align: center; padding: 9px 0; }

  /* ================= GEZEGEN MODU: DOCK ================= */
  #dock {
    position: fixed; left: 16px; top: 50%; transform: translateY(-50%);
    display: none; flex-direction: column; gap: 8px; z-index: 12;
  }
  body.planet #dock { display: flex; }
  .dockBtn {
    width: 52px; height: 52px; border-radius: 16px; cursor: pointer;
    background: rgba(14,19,48,.75); border: 1px solid rgba(120,140,255,.25);
    color: #8fa0e8; font-size: 10px; letter-spacing: .5px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    backdrop-filter: blur(10px); transition: all .15s;
  }
  .dockBtn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; }
  .dockBtn:hover { border-color: rgba(120,140,255,.7); color: #fff; }
  .dockBtn.on { background: #3a55d4; color: #fff; border-color: transparent; }

  /* ================= GEZEGEN MODU: SOL ÇEKMECE ================= */
  #drawer {
    position: fixed; top: 0; left: 0; width: 420px; height: 100%;
    background: linear-gradient(160deg, rgba(10,14,36,.95), rgba(4,6,18,.97));
    border-right: 1px solid rgba(120,140,255,.2); backdrop-filter: blur(18px);
    z-index: 14; display: flex; flex-direction: column;
    transform: translateX(-105%); transition: transform .4s cubic-bezier(.22,1,.3,1);
    padding-top: 54px;
  }
  #drawer.open { transform: translateX(0); }
  #drawerHead { display: flex; align-items: center; justify-content: space-between; padding: 14px 22px 10px; }
  #drawerTitle { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: #6b76a8; }
  #drawerClose { background: none; border: none; color: #7f8ec9; font-size: 18px; cursor: pointer; }
  #drawerClose:hover { color: #fff; }
  .dpage { display: none; flex: 1; overflow-y: auto; padding: 6px 22px 24px; }
  .dpage.on { display: block; }
  .dpage::-webkit-scrollbar { width: 4px; }
  .dpage::-webkit-scrollbar-thumb { background: rgba(120,140,255,.3); border-radius: 2px; }
  #dpage-claude { display: none; flex-direction: column; }
  #dpage-claude.on { display: flex; }

  .field-label { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #6b76a8; margin: 14px 0 7px; }
  .input, textarea, select {
    width: 100%; background: rgba(20,26,60,.5); border: 1px solid rgba(120,140,255,.2);
    border-radius: 10px; padding: 9px 13px; color: #e6ebff; font-size: 13px;
    outline: none; font-family: inherit; resize: vertical;
  }
  .input:focus, textarea:focus, select:focus { border-color: rgba(120,140,255,.55); }
  select option { background: #0a0e24; }
  #pProgress { width: 100%; accent-color: #6d8bff; }
  #progressVal { font-size: 12px; color: #8fa0e8; margin-left: 8px; }
  #progressRow { display: flex; align-items: center; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  .plan-item { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid rgba(120,140,255,.08); }
  .plan-item input[type=checkbox] { accent-color: #6d8bff; width: 15px; height: 15px; flex-shrink: 0; }
  .plan-item span { flex: 1; font-size: 13px; }
  .plan-item.done span { text-decoration: line-through; color: #5a6699; }
  .plan-item .del { background: none; border: none; color: #5a6699; cursor: pointer; font-size: 14px; }
  .plan-item .del:hover { color: #ff7b7b; }
  #saveState { font-size: 11px; color: #4a5480; margin-top: 14px; text-align: right; }

  #treeBox { font-size: 12.5px; line-height: 1.9; font-family: "SF Mono", Menlo, monospace; }
  #treeBox details { padding-left: 16px; }
  #treeBox > details { padding-left: 0; }
  #treeBox summary { cursor: pointer; color: #9db1ff; list-style: none; }
  #treeBox summary::before { content: '▸ '; color: #5a6699; }
  #treeBox details[open] > summary::before { content: '▾ '; }
  #treeBox .file { padding-left: 16px; color: #8b93b8; cursor: pointer; }
  #treeBox .file:hover { color: #d8deff; }
  #treeBox .file::before { content: '· '; color: #3d4568; }

  #readmeBox { font-size: 13.5px; line-height: 1.7; color: #c3cbee; }
  #readmeBox h1, #readmeBox h2, #readmeBox h3 { color: #f0f3ff; margin: 16px 0 8px; }
  #readmeBox h1 { font-size: 19px; } #readmeBox h2 { font-size: 16px; } #readmeBox h3 { font-size: 14px; }
  #readmeBox p { margin: 8px 0; }
  #readmeBox li { margin: 4px 0 4px 18px; }
  #readmeBox code { background: rgba(120,140,255,.12); padding: 1px 6px; border-radius: 5px; font-size: 12px; font-family: "SF Mono", Menlo, monospace; }
  #readmeBox pre { background: rgba(10,14,36,.8); border: 1px solid rgba(120,140,255,.15); border-radius: 10px; padding: 12px 14px; overflow-x: auto; margin: 10px 0; }
  #readmeBox pre code { background: none; padding: 0; }
  #readmeBox .task { list-style: none; margin-left: 2px; }
  #readmeBox .task.done { color: #6dff9e; }
  #readmeBox .task.todo { color: #ffc861; }

  #claudeOut {
    flex: 1; overflow-y: auto; background: rgba(3,5,16,.85);
    border: 1px solid rgba(120,140,255,.15); border-radius: 12px;
    padding: 14px; font-family: "SF Mono", Menlo, monospace; font-size: 12px;
    line-height: 1.65; white-space: pre-wrap; word-break: break-word; margin-bottom: 10px;
    min-height: 160px; user-select: text;
  }
  #claudeOut .c-info { color: #5a6699; }
  #claudeOut .c-text { color: #d8deff; }
  #claudeOut .c-tool { color: #7fd4ff; }
  #claudeOut .c-result { color: #6dff9e; }
  #claudeOut .c-err { color: #ff8f8f; }
  #claudeOut .c-raw { color: #6b76a8; }
  #claudeRow { display: flex; gap: 8px; align-items: flex-end; }
  #claudePrompt { flex: 1; min-height: 42px; max-height: 130px; }
  #claudeOpts { display: flex; align-items: center; gap: 12px; margin-top: 8px; font-size: 11.5px; color: #6b76a8; flex-wrap: wrap; }
  #claudeOpts input { accent-color: #6d8bff; }
  .run { background: #3a55d4 !important; color: #fff !important; border-color: transparent !important; }
  .stop { background: #7c2b3a !important; color: #ffd3d3 !important; border-color: transparent !important; }

  /* ================= DOSYA GÖRÜNTÜLEYİCİ ================= */
  #viewer {
    position: fixed; top: 66px; right: 16px; bottom: 16px; width: min(46vw, 720px);
    background: linear-gradient(165deg, rgba(10,15,40,.92), rgba(4,6,18,.95));
    border: 1px solid rgba(120,180,255,.35); border-radius: 18px;
    backdrop-filter: blur(16px); z-index: 13; display: flex; flex-direction: column;
    transform: translateX(110%); opacity: 0; transition: transform .4s cubic-bezier(.22,1,.3,1), opacity .3s;
    box-shadow: 0 0 60px rgba(80,140,255,.12), 0 24px 80px rgba(0,0,0,.5);
    overflow: hidden;
  }
  #viewer.open { transform: translateX(0); opacity: 1; }
  #viewerHead {
    display: flex; align-items: center; gap: 10px; padding: 13px 18px;
    border-bottom: 1px solid rgba(120,140,255,.18); flex-shrink: 0;
  }
  #vName { font-size: 13px; font-weight: 600; color: #f0f3ff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #vMeta { font-size: 11px; color: #5a6699; white-space: nowrap; }
  #vOpen { margin-left: auto; }
  #vClose { background: none; border: none; color: #7f8ec9; font-size: 18px; cursor: pointer; }
  #vClose:hover { color: #fff; }
  #vBody { flex: 1; overflow: auto; user-select: text; }
  #vBody::-webkit-scrollbar { width: 6px; height: 6px; }
  #vBody::-webkit-scrollbar-thumb { background: rgba(120,140,255,.3); border-radius: 3px; }
  #vBody pre.codeview {
    padding: 16px 18px; font-family: "SF Mono", Menlo, monospace; font-size: 12px;
    line-height: 1.6; color: #d8deff; white-space: pre-wrap; word-break: break-word;
  }
  #vBody .mdview { padding: 18px 22px; font-size: 13.5px; line-height: 1.7; color: #c3cbee; }
  #vBody .mdview h1, #vBody .mdview h2, #vBody .mdview h3 { color: #f0f3ff; margin: 16px 0 8px; }
  #vBody .mdview code { background: rgba(120,140,255,.12); padding: 1px 6px; border-radius: 5px; font-family: "SF Mono", Menlo, monospace; font-size: 12px; }
  #vBody .mdview pre { background: rgba(10,14,36,.8); border: 1px solid rgba(120,140,255,.15); border-radius: 10px; padding: 12px 14px; overflow-x: auto; margin: 10px 0; }
  #vBody .mdview li { margin: 4px 0 4px 18px; }
  #vBody .mdview .task { list-style: none; }
  #vBody .mdview .task.done { color: #6dff9e; }
  #vBody .mdview .task.todo { color: #ffc861; }
  #vBody img { display: block; max-width: 100%; margin: 0 auto; }
  #vBody .mediaWrap { display: flex; align-items: center; justify-content: center; height: 100%; padding: 20px; }
  #vBody video { max-width: 100%; max-height: 100%; border-radius: 10px; }
  #vBody iframe { width: 100%; height: 100%; border: none; background: #fff; }
  #vBody .binWrap { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 14px; color: #6b76a8; }
  #vBody .binWrap .ic { font-size: 44px; }

  /* ================= EVREN SEÇİMİ ================= */
  #universePick {
    position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 40px;
    background: radial-gradient(ellipse at 50% 40%, rgba(20,26,66,.55), rgba(2,3,10,.97) 70%);
    transition: opacity .8s ease;
  }
  #universePick.hidden { opacity: 0; pointer-events: none; }
  #universePick h1 { font-size: 22px; letter-spacing: 10px; font-weight: 300; color: #cdd6ff; text-transform: uppercase; }
  #uniCards { display: flex; gap: 40px; }
  .uniCard {
    width: 300px; height: 340px; border-radius: 24px; cursor: pointer;
    border: 1px solid rgba(120,140,255,.25);
    background: linear-gradient(170deg, rgba(16,22,56,.8), rgba(6,9,26,.9));
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    transition: all .3s;
  }
  .uniCard:hover { transform: translateY(-8px); border-color: rgba(120,140,255,.7); box-shadow: 0 20px 60px rgba(60,90,255,.25); }
  .uniCard .orb {
    width: 110px; height: 110px; border-radius: 50%;
    background: radial-gradient(circle at 32% 30%, #fff, var(--oc) 45%, #060a20 100%);
    box-shadow: 0 0 60px var(--og); margin-bottom: 10px;
  }
  .uniCard b { font-size: 19px; color: #f0f3ff; font-weight: 600; }
  .uniCard small { font-size: 12px; color: #7f8ec9; letter-spacing: 2px; }
  .uniCard .cnt { font-size: 11px; color: #5a6699; }

  /* ================= WARP & INTRO ================= */
  #warp {
    position: fixed; inset: 0; z-index: 35; pointer-events: none; opacity: 0;
    background: radial-gradient(circle at 50% 50%, rgba(180,200,255,.85), rgba(60,90,255,.25) 45%, transparent 75%);
  }
  #warp.go { animation: warpFlash .55s ease-out; }
  @keyframes warpFlash { 0% { opacity: 0; } 35% { opacity: 1; } 100% { opacity: 0; } }
  #intro {
    position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column;
    align-items: center; justify-content: center; background: #02030a;
    transition: opacity 1s ease; pointer-events: none;
  }
  #intro h1 { font-size: 28px; letter-spacing: 12px; color: #cdd6ff; font-weight: 300; text-transform: uppercase; }
  #intro p { margin-top: 12px; font-size: 12px; letter-spacing: 4px; color: #5a6699; }
</style>
</head>
<body>
<canvas id="space"></canvas>
<canvas id="psky"></canvas>

<div id="topbar">
  <div id="title">Project Galaxy</div>
  <div class="spaceOnly">
    <div class="chip" id="uniLabel"></div>
    <input id="search" placeholder="Proje ara… (Enter: git)">
    <button class="btn" id="overviewBtn">Genel Bakış</button>
    <button class="btn" id="switchUniBtn">Evren Değiştir</button>
    <div id="stats"></div>
  </div>
  <div id="planetBar">
    <button class="btn" id="exitPlanet">‹ Uzaya Dön</button>
    <div id="crumbs"></div>
    <div class="chip" id="planetChip"></div>
  </div>
</div>

<div id="legend">
  <span style="--c:#5ec8ff">Aktif</span>
  <span style="--c:#ffc861">Beklemede</span>
  <span style="--c:#6dff9e">Tamamlandı</span>
  <span style="--c:#8a8fa8">Arşiv</span>
  <span style="--c:#c77bff">Keşfedilmemiş</span>
</div>
<div id="hint"></div>
<div id="tip"></div>
<canvas id="minimap" width="200" height="140"></canvas>

<!-- uzayda bilgi kartı -->
<div id="card">
  <div class="cGroup"></div>
  <div class="cName"></div>
  <div class="cStage"></div>
  <div class="bar"><i></i></div>
  <div class="cDesc"></div>
  <div class="cBtns">
    <button class="btn primary" id="cardEnter">Gezegene İn ▸</button>
    <button class="btn" id="cardFolder">Klasör</button>
  </div>
</div>

<!-- gezegen modu dock -->
<div id="dock">
  <button class="dockBtn" data-d="genel"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></svg>Bilgi</button>
  <button class="dockBtn" data-d="readme"><svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M9 9h6M9 13h6M9 17h4"/></svg>Readme</button>
  <button class="dockBtn" data-d="tree"><svg viewBox="0 0 24 24"><path d="M4 5h7M4 12h4M4 19h7"/><circle cx="17" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="17" cy="19" r="2"/></svg>Ağaç</button>
  <button class="dockBtn" data-d="claude"><svg viewBox="0 0 24 24"><path d="M4 17l6-5-6-5M12 19h8"/></svg>Claude</button>
</div>

<!-- sol çekmece -->
<div id="drawer">
  <div id="drawerHead">
    <div id="drawerTitle"></div>
    <button id="drawerClose">✕</button>
  </div>
  <div class="dpage" id="dpage-genel">
    <div class="row2">
      <div>
        <div class="field-label">Durum</div>
        <select id="pStatus">
          <option value="active">Aktif</option>
          <option value="paused">Beklemede</option>
          <option value="done">Tamamlandı</option>
          <option value="archive">Arşiv</option>
          <option value="unknown">Keşfedilmemiş</option>
        </select>
      </div>
      <div>
        <div class="field-label">İlerleme</div>
        <div id="progressRow">
          <input type="range" id="pProgress" min="0" max="100">
          <span id="progressVal"></span>
        </div>
      </div>
    </div>
    <div class="field-label">Aşama</div>
    <input class="input" id="pStage" placeholder="Şu an hangi aşamada?">
    <div class="field-label">Açıklama</div>
    <textarea id="pDesc" rows="2"></textarea>
    <div class="field-label">Plan / Yapılacaklar</div>
    <div id="planList"></div>
    <input class="input" id="newPlan" placeholder="Yeni madde… (Enter)" style="margin-top:8px">
    <div class="field-label">Notlar</div>
    <textarea id="pNotes" rows="4"></textarea>
    <div id="saveState"></div>
  </div>
  <div class="dpage" id="dpage-readme"><div id="readmeBox"></div></div>
  <div class="dpage" id="dpage-tree"><div id="treeBox"></div></div>
  <div class="dpage" id="dpage-claude">
    <div id="claudeOut"></div>
    <div id="claudeRow">
      <textarea class="input" id="claudePrompt" placeholder="Claude'a ne yaptıralım? (⌘+Enter)"></textarea>
    </div>
    <div id="claudeOpts">
      <button class="btn run" id="claudeRunBtn">Çalıştır</button>
      <button class="btn stop" id="claudeStopBtn" style="display:none">Durdur</button>
      <label><input type="checkbox" id="claudeCont"> devam et</label>
      <button class="btn" id="claudeTermBtn" style="padding:4px 10px">Terminal</button>
      <span style="margin-left:auto" id="claudeState"></span>
    </div>
  </div>
</div>

<!-- dosya görüntüleyici -->
<div id="viewer">
  <div id="viewerHead">
    <div id="vName"></div>
    <div id="vMeta"></div>
    <button class="btn" id="vOpen">Uygulamada Aç</button>
    <button id="vClose">✕</button>
  </div>
  <div id="vBody"></div>
</div>

  <h1>Evrenini Seç</h1>
  <div id="uniCards"></div>
</div>

<div id="warp"></div>
<div id="intro">
  <h1>Project Galaxy</h1>
  <p>EVREN YÜKLENİYOR</p>
</div>

<script src="galaxy-data.js"></script>
<script>
// ---------- tarayıcı modu ----------
if (!window.galaxy) {
  window.galaxy = {
    isBrowser: true,
    load: async () => {
      const data = (window.GALAXY_DATA || { universes: [], projects: {} });
      const overrides = JSON.parse(localStorage.getItem('galaxyOverrides') || '{}');
      const universes = (data.universes || []).map(u => ({ id: u.id, name: u.name, subtitle: u.subtitle || '' }));
      const projects = Object.entries(data.projects).map(([id, saved]) => {
        const o = overrides[id] || {};
        const prefix = id.includes('/') ? id.split('/')[0] : '';
        const rawUni = (data.universes || []).find(y => (y.prefix || '') === prefix && (prefix !== '' || !y.prefix));
        return {
          id, universe: rawUni ? rawUni.id : (universes[0] ? universes[0].id : ''),
          name: o.name ?? saved.name ?? id.split('/').pop(),
          group: o.group ?? saved.group ?? 'Keşfedilmemiş',
          status: o.status ?? saved.status ?? 'unknown',
          stage: o.stage ?? saved.stage ?? '',
          progress: o.progress ?? saved.progress ?? 0,
          plan: o.plan ?? saved.plan ?? [],
          notes: o.notes ?? saved.notes ?? '',
          desc: o.desc ?? saved.desc ?? '',
          mtime: null, path: null
        };
      });
      return { universes, projects };
    },
    save: async (p) => {
      const overrides = JSON.parse(localStorage.getItem('galaxyOverrides') || '{}');
      const { id, name, group, status, stage, progress, plan, notes, desc } = p;
      overrides[id] = { name, group, status, stage, progress, plan, notes, desc };
      localStorage.setItem('galaxyOverrides', JSON.stringify(overrides));
      return true;
    },
    openFolder: async () => {}
  };
}
</script>
<script>
/* ============================================================
   GENEL DURUM
============================================================ */
const $ = id => document.getElementById(id);
const spaceCv = $('space'), sctx = spaceCv.getContext('2d');
const planetCv = $('psky'), pctx = planetCv.getContext('2d');
const miniCv = $('minimap'), mctx = miniCv.getContext('2d');

let W, H, DPR;
function resize() {
  DPR = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  for (const [cv, c] of [[spaceCv, sctx], [planetCv, pctx]]) {
    cv.width = W * DPR; cv.height = H * DPR;
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    c.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
}
window.addEventListener('resize', resize);
resize();

const COLORS = {
  active:  { core: '#5ec8ff', glow: 'rgba(94,200,255,', rgb: [94,200,255] },
  paused:  { core: '#ffc861', glow: 'rgba(255,200,97,', rgb: [255,200,97] },
  done:    { core: '#6dff9e', glow: 'rgba(109,255,158,', rgb: [109,255,158] },
  archive: { core: '#8a8fa8', glow: 'rgba(138,143,168,', rgb: [138,143,168] },
  unknown: { core: '#c77bff', glow: 'rgba(199,123,255,', rgb: [199,123,255] }
};
const NEBULA_PALETTE = [[100,140,255],[255,120,180],[120,255,200],[255,180,100],[180,120,255],[100,220,255]];

let mode = 'space'; // 'space' | 'planet'
let allProjects = [], universes = [], currentUni = null;
let projects = [], groups = [];
let hovered = null, carded = null, selected = null;
let searchQuery = '';
const GOLDEN = Math.PI * (3 - Math.sqrt(5));

const cam = { x: 0, y: 0, z: 0.22, tx: 0, ty: 0, tz: 0.22 };
let vx = 0, vy = 0;

function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
function statusLabel(s) { return { active: 'Aktif', paused: 'Beklemede', done: 'Tamamlandı', archive: 'Arşiv', unknown: 'Keşfedilmemiş' }[s] || s; }
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return `rgb(${Math.max(0, Math.round(r * (1 + f)))},${Math.max(0, Math.round(g * (1 + f)))},${Math.max(0, Math.round(b * (1 + f)))})`;
}
function fmtSize(n) {
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1048576).toFixed(1) + ' MB';
}
function warpFlash() {
  const w = $('warp');
  w.classList.remove('go'); void w.offsetWidth; w.classList.add('go');
}

/* ============================================================
   YERLEŞİM (uzay)
============================================================ */
function layout() {
  projects = allProjects.filter(p => p.universe === currentUni);
  const byGroup = {};
  for (const p of projects) (byGroup[p.group] ||= []).push(p);
  const names = Object.keys(byGroup).sort((a, b) => byGroup[b].length - byGroup[a].length);
  groups = [];
  const R = names.length > 2 ? 1600 : 900;
  names.forEach((name, i) => {
    const angle = i * (Math.PI * 2 / Math.max(names.length, 1)) - Math.PI / 2;
    const gx = names.length === 1 ? 0 : Math.cos(angle) * R;
    const gy = names.length === 1 ? 0 : Math.sin(angle) * R * 0.62;
    const color = NEBULA_PALETTE[i % NEBULA_PALETTE.length];
    const g = { name, x: gx, y: gy, color, projects: byGroup[name], labelY: 0, rad: 0 };
    byGroup[name].forEach((p, j) => {
      const r = 90 + 105 * Math.sqrt(j);
      const a = j * GOLDEN + i * 1.7;
      p.wx = gx + Math.cos(a) * r;
      p.wy = gy + Math.sin(a) * r * 0.85;
      p.radius = 16 + (p.plan?.length ? Math.min(p.plan.length * 1.5, 9) : 0) + (p.status === 'active' ? 5 : 0);
      p.seed = Math.random() * 1000;
    });
    groups.push(g);
  });
  const active = projects.filter(p => p.status === 'active').length;
  $('stats').textContent = `${projects.length} proje · ${active} aktif`;
}

/* ============================================================
   YILDIZLAR
============================================================ */
const starLayers = [];
(function () {
  for (const d of [{ n: 420, depth: 0.15, size: 1.0 }, { n: 260, depth: 0.35, size: 1.4 }, { n: 140, depth: 0.65, size: 2.0 }]) {
    const stars = [];
    for (let i = 0; i < d.n; i++) stars.push({
      x: (Math.random() - 0.5) * 9000, y: (Math.random() - 0.5) * 9000,
      s: Math.random() * d.size + 0.3, tw: Math.random() * Math.PI * 2,
      hue: Math.random() < 0.12 ? 'rgba(160,190,255,' : (Math.random() < 0.08 ? 'rgba(255,220,180,' : 'rgba(230,235,255,')
    });
    starLayers.push({ ...d, stars });
  }
})();

function toScreen(wx, wy) { return [(wx - cam.x) * cam.z + W / 2, (wy - cam.y) * cam.z + H / 2]; }
function toWorld(sx, sy) { return [(sx - W / 2) / cam.z + cam.x, (sy - H / 2) / cam.z + cam.y]; }

/* ============================================================
   UZAY ÇİZİMİ
============================================================ */
let t = 0;
function drawSpace() {
  cam.x += (cam.tx - cam.x) * 0.08;
  cam.y += (cam.ty - cam.y) * 0.08;
  cam.z += (cam.tz - cam.z) * 0.09;
  if (!dragging) { cam.tx += vx; cam.ty += vy; vx *= 0.93; vy *= 0.93; }

  const ctx = sctx;
  ctx.fillStyle = '#02030a'; ctx.fillRect(0, 0, W, H);
  const bg = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W, H));
  bg.addColorStop(0, 'rgba(16,20,50,.35)'); bg.addColorStop(1, 'rgba(2,3,10,0)');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  for (const layer of starLayers) for (const s of layer.stars) {
    const sx = (s.x - cam.x * layer.depth) * (cam.z * layer.depth + (1 - layer.depth)) + W / 2;
    const sy = (s.y - cam.y * layer.depth) * (cam.z * layer.depth + (1 - layer.depth)) + H / 2;
    if (sx < -10 || sx > W + 10 || sy < -10 || sy > H + 10) continue;
    ctx.fillStyle = s.hue + (0.35 + 0.55 * Math.abs(Math.sin(t * 0.8 + s.tw))) + ')';
    ctx.beginPath(); ctx.arc(sx, sy, s.s, 0, Math.PI * 2); ctx.fill();
  }

  for (const g of groups) {
    const [gx, gy] = toScreen(g.x, g.y);
    const rad = (240 + 90 * Math.sqrt(g.projects.length)) * cam.z * 2.6;
    g.rad = rad;
    if (gx < -rad || gx > W + rad || gy < -rad || gy > H + rad) continue;
    const [r, gr, b] = g.color;
    const grad = ctx.createRadialGradient(gx, gy, 0, gx, gy, rad);
    grad.addColorStop(0, `rgba(${r},${gr},${b},0.10)`);
    grad.addColorStop(0.5, `rgba(${r},${gr},${b},0.045)`);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(gx, gy, rad, 0, Math.PI * 2); ctx.fill();
    if (cam.z < 0.55) {
      const hotG = hoveredGroup === g;
      ctx.fillStyle = `rgba(${r},${gr},${b},${Math.min(0.95, (0.6 - cam.z) * 2.4) * (hotG ? 1 : 0.8)})`;
      ctx.font = `${hotG ? 700 : 600} ${Math.max(13, 30 * cam.z + 8)}px -apple-system, sans-serif`;
      ctx.textAlign = 'center';
      g.labelY = gy - rad * 0.55;
      ctx.fillText(g.name.toUpperCase() + (hotG ? '  ▸' : ''), gx, g.labelY);
    }
  }

  const q = searchQuery.toLowerCase();
  for (const p of projects) {
    const [sx, sy] = toScreen(p.wx, p.wy);
    const r = p.radius * cam.z;
    if (sx < -80 || sx > W + 80 || sy < -80 || sy > H + 80) continue;
    const c = COLORS[p.status] || COLORS.unknown;
    const dim = q && !p.name.toLowerCase().includes(q) && !p.id.toLowerCase().includes(q);
    const isHot = p === hovered || p === carded;
    const pulse = 1 + 0.06 * Math.sin(t * 1.6 + p.seed);
    const R2 = Math.max(r * pulse, 3);
    ctx.globalAlpha = dim ? 0.12 : 1;

    const glow = ctx.createRadialGradient(sx, sy, 0, sx, sy, R2 * (isHot ? 5 : 3.2));
    glow.addColorStop(0, c.glow + (isHot ? '0.5)' : '0.3)'));
    glow.addColorStop(1, c.glow + '0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(sx, sy, R2 * (isHot ? 5 : 3.2), 0, Math.PI * 2); ctx.fill();

    const body = ctx.createRadialGradient(sx - R2 * 0.35, sy - R2 * 0.35, R2 * 0.1, sx, sy, R2);
    body.addColorStop(0, '#ffffff'); body.addColorStop(0.25, c.core); body.addColorStop(1, shade(c.core, -0.75));
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.arc(sx, sy, R2, 0, Math.PI * 2); ctx.fill();

    if (p.progress > 0) {
      ctx.strokeStyle = c.glow + '0.85)';
      ctx.lineWidth = Math.max(1.5, 2.4 * cam.z);
      ctx.beginPath();
      ctx.arc(sx, sy, R2 + Math.max(5, 7 * cam.z), -Math.PI / 2, -Math.PI / 2 + (p.progress / 100) * Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = c.glow + '0.15)';
      ctx.beginPath(); ctx.arc(sx, sy, R2 + Math.max(5, 7 * cam.z), 0, Math.PI * 2); ctx.stroke();
    }

    if (cam.z > 0.35 || isHot) {
      ctx.fillStyle = isHot ? '#ffffff' : 'rgba(205,214,255,.75)';
      ctx.font = `${isHot ? 600 : 400} ${Math.max(11, 13 * Math.min(cam.z * 1.6, 1.2))}px -apple-system, sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText(p.name, sx, sy + R2 + Math.max(18, 22 * cam.z));
    }
    ctx.globalAlpha = 1;
  }
  drawMinimap();
}

/* ============================================================
   MİNİMAP
============================================================ */
function drawMinimap() {
  const mw = 200, mh = 140;
  mctx.clearRect(0, 0, mw, mh);
  if (!groups.length) return;
  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
  for (const p of projects) {
    minX = Math.min(minX, p.wx); maxX = Math.max(maxX, p.wx);
    minY = Math.min(minY, p.wy); maxY = Math.max(maxY, p.wy);
  }
  minX -= 350; maxX += 350; minY -= 350; maxY += 350;
  const sc = Math.min(mw / (maxX - minX), mh / (maxY - minY));
  const ox = (mw - (maxX - minX) * sc) / 2, oy = (mh - (maxY - minY) * sc) / 2;
  const mx = wx => ox + (wx - minX) * sc, my = wy => oy + (wy - minY) * sc;

  for (const g of groups) {
    const [r, gr, b] = g.color;
    mctx.fillStyle = `rgba(${r},${gr},${b},0.16)`;
    mctx.beginPath(); mctx.arc(mx(g.x), my(g.y), Math.max(10, 90 * Math.sqrt(g.projects.length) * sc * 3), 0, Math.PI * 2); mctx.fill();
  }
  for (const p of projects) {
    mctx.fillStyle = (COLORS[p.status] || COLORS.unknown).core;
    mctx.beginPath(); mctx.arc(mx(p.wx), my(p.wy), 1.6, 0, Math.PI * 2); mctx.fill();
  }
  // görünüm çerçevesi
  const [wx0, wy0] = toWorld(0, 0), [wx1, wy1] = toWorld(W, H);
  mctx.strokeStyle = 'rgba(200,215,255,.6)';
  mctx.lineWidth = 1;
  mctx.strokeRect(mx(wx0), my(wy0), (wx1 - wx0) * sc, (wy1 - wy0) * sc);
  miniCv._map = { minX, minY, sc, ox, oy };
}
miniCv.addEventListener('click', e => {
  const m = miniCv._map; if (!m) return;
  const r = miniCv.getBoundingClientRect();
  cam.tx = (e.clientX - r.left - m.ox) / m.sc + m.minX;
  cam.ty = (e.clientY - r.top - m.oy) / m.sc + m.minY;
});

/* ============================================================
   GEZEGEN MODU
============================================================ */
const planet = {
  proj: null, rel: '', entries: [], nodes: [], extra: 0,
  anim: 0, cx: 0, cy: 0, tcx: 0, tcy: 0, ringScale: 1, tRingScale: 1,
  hovered: null, loading: false
};

const CODE_EXT = new Set(['js','jsx','ts','tsx','py','swift','kt','kts','java','c','cpp','h','m','cs','go','rs','rb','php','sh','dart','vue','sql','gradle']);
const DOC_EXT = new Set(['md','txt','pdf','doc','docx','pages','key','ppt','pptx','xls','xlsx','csv','rtf']);
const IMG_EXT = new Set(['png','jpg','jpeg','gif','webp','svg','bmp','ico','heic']);
const MED_EXT = new Set(['mp4','mov','webm','mp3','wav','m4a']);
const CFG_EXT = new Set(['json','yml','yaml','xml','plist','toml','ini','cfg','conf','env','properties','lock']);

function fileColor(name, isDir) {
  if (isDir) return { core: '#9db1ff', glow: 'rgba(157,177,255,' };
  const ext = name.split('.').pop().toLowerCase();
  if (CODE_EXT.has(ext)) return { core: '#5ec8ff', glow: 'rgba(94,200,255,' };
  if (DOC_EXT.has(ext)) return { core: '#ffc861', glow: 'rgba(255,200,97,' };
  if (IMG_EXT.has(ext)) return { core: '#ff8fc0', glow: 'rgba(255,143,192,' };
  if (MED_EXT.has(ext)) return { core: '#c77bff', glow: 'rgba(199,123,255,' };
  if (CFG_EXT.has(ext)) return { core: '#6dff9e', glow: 'rgba(109,255,158,' };
  return { core: '#8a8fa8', glow: 'rgba(138,143,168,' };
}

async function enterPlanet(p) {
  warpFlash();
  selected = p;
  planet.proj = p; planet.rel = ''; planet.hovered = null;
  hideCard();
  setTimeout(async () => {
    mode = 'planet';
    document.body.classList.add('planet');
    $('planetChip').textContent = `${statusLabel(p.status)} · %${p.progress}`;
    $('hint').textContent = 'tıkla: aç · çift tık klasör: gir · sağ tık / geri: üst klasör · ESC: kapat';
    closeDrawer(); closeViewer();
    $('claudeOut').innerHTML = p._claudeLog || '<span class="c-info">Bu projede Claude\'a komut ver — çıktı burada akar.</span>';
    $('readmeBox').dataset.for = ''; $('treeBox').dataset.for = '';
    fillGenelForm(p);
    await loadOrbit();
  }, 260);
}

function exitPlanet() {
  warpFlash();
  setTimeout(() => {
    mode = 'space';
    document.body.classList.remove('planet');
    closeDrawer(); closeViewer();
    $('hint').textContent = 'sürükle: gezin · tekerlek: yakınlaş · tık: bilgi · çift tık: gezegene in';
    if (selected) { cam.tx = selected.wx; cam.ty = selected.wy; cam.tz = Math.min(cam.tz, 0.9); }
  }, 260);
}
$('exitPlanet').addEventListener('click', exitPlanet);

async function loadOrbit() {
  planet.loading = true;
  planet.anim = 0;
  let entries = null;
  if (window.galaxy.list && planet.proj.path) {
    entries = await window.galaxy.list(planet.proj.path, planet.rel);
  }
  planet.entries = entries || [];
  planet.loading = false;
  buildOrbitNodes();
  renderCrumbs();
}

function buildOrbitNodes() {
  const rings = [{ r: 150, cap: 8, speed: 0.05 }, { r: 250, cap: 13, speed: -0.032 }, { r: 350, cap: 18, speed: 0.02 }];
  const nodes = [];
  let idx = 0;
  const shown = planet.entries.slice(0, 39);
  planet.extra = Math.max(0, planet.entries.length - shown.length);
  for (let ri = 0; ri < rings.length && idx < shown.length; ri++) {
    const ring = rings[ri];
    const inRing = Math.min(ring.cap, shown.length - idx);
    for (let i = 0; i < inRing; i++, idx++) {
      const e = shown[idx];
      nodes.push({
        entry: e, ring: ri, r: ring.r, speed: ring.speed,
        a0: (i / inRing) * Math.PI * 2 + ri * 0.9,
        size: e.dir ? 17 : 11
      });
    }
  }
  planet.nodes = nodes;
}

function renderCrumbs() {
  const c = $('crumbs');
  c.innerHTML = '';
  const segs = planet.rel ? planet.rel.split('/') : [];
  const mk = (label, rel, here) => {
    const s = document.createElement('span');
    s.className = 'crumb' + (here ? ' here' : '');
    s.textContent = label;
    s.addEventListener('click', () => { if (!here) { planet.rel = rel; loadOrbit(); } });
    return s;
  };
  c.appendChild(mk(planet.proj.name, '', segs.length === 0));
  segs.forEach((seg, i) => {
    const sep = document.createElement('span'); sep.className = 'crumbSep'; sep.textContent = '›';
    c.appendChild(sep);
    c.appendChild(mk(seg, segs.slice(0, i + 1).join('/'), i === segs.length - 1));
  });
}

function planetCenter() {
  const viewerOpen = $('viewer').classList.contains('open');
  const drawerOpen = $('drawer').classList.contains('open');
  let cx = W * 0.5;
  if (viewerOpen && drawerOpen) cx = W * 0.38;
  else if (viewerOpen) cx = W * 0.30;
  else if (drawerOpen) cx = W * 0.62;
  return [cx, H * 0.52];
}

function drawPlanet() {
  const ctx = pctx;
  const p = planet.proj;
  if (!p) return;
  const c = COLORS[p.status] || COLORS.unknown;
  planet.anim = Math.min(1, planet.anim + 0.03);
  const ease = 1 - Math.pow(1 - planet.anim, 3);

  const [tcx, tcy] = planetCenter();
  planet.cx += (tcx - (planet.cx || tcx)) * 0.1 || 0;
  planet.cy += (tcy - (planet.cy || tcy)) * 0.1 || 0;
  planet.ringScale += (planet.tRingScale - planet.ringScale) * 0.1;
  if (!planet.cx) { planet.cx = tcx; planet.cy = tcy; }

  ctx.fillStyle = '#02030a'; ctx.fillRect(0, 0, W, H);

  // yıldızlar (sabit hafif kayma)
  for (const layer of starLayers) for (const s of layer.stars) {
    const sx = ((s.x * 0.4 + t * 2 * layer.depth) % 4500 + 4500) % 4500 / 4500 * (W + 80) - 40;
    const sy = ((s.y * 0.4) % 2600 + 2600) % 2600 / 2600 * (H + 80) - 40;
    ctx.fillStyle = s.hue + (0.25 + 0.45 * Math.abs(Math.sin(t * 0.8 + s.tw))) + ')';
    ctx.beginPath(); ctx.arc(sx, sy, s.s * 0.8, 0, Math.PI * 2); ctx.fill();
  }

  // ufuktaki gezegen yüzeyi
  const [r, g, b] = c.rgb;
  const horizonY = H * 1.92, horizonR = H * 1.28;
  const surf = ctx.createRadialGradient(W / 2, horizonY, horizonR * 0.55, W / 2, horizonY, horizonR);
  surf.addColorStop(0, `rgba(${r},${g},${b},0.28)`);
  surf.addColorStop(0.75, `rgba(${Math.round(r*0.4)},${Math.round(g*0.4)},${Math.round(b*0.4)},0.35)`);
  surf.addColorStop(0.97, `rgba(${r},${g},${b},0.75)`);
  surf.addColorStop(1, `rgba(255,255,255,0.9)`);
  ctx.fillStyle = surf;
  ctx.beginPath(); ctx.arc(W / 2, horizonY, horizonR, 0, Math.PI * 2); ctx.fill();
  // atmosfer parlaması
  const atm = ctx.createRadialGradient(W / 2, horizonY, horizonR, W / 2, horizonY, horizonR * 1.25);
  atm.addColorStop(0, `rgba(${r},${g},${b},0.30)`);
  atm.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = atm;
  ctx.beginPath(); ctx.arc(W / 2, horizonY, horizonR * 1.25, 0, Math.PI * 2); ctx.fill();

  // auroralar
  for (let i = 0; i < 3; i++) {
    ctx.strokeStyle = `rgba(${r},${g},${b},${0.05 + 0.03 * Math.sin(t * 0.7 + i * 2)})`;
    ctx.lineWidth = 40 + i * 26;
    ctx.beginPath();
    for (let x = -50; x <= W + 50; x += 40) {
      const y = H * 0.78 + i * 40 + Math.sin(x * 0.004 + t * 0.5 + i) * 26;
      x === -50 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  const cx = planet.cx, cy = planet.cy;
  const rs = planet.ringScale * Math.min(1, Math.min(W, H) / 900);

  // yörünge halkaları
  for (const ringR of [150, 250, 350]) {
    ctx.strokeStyle = `rgba(${r},${g},${b},0.13)`;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(cx, cy, ringR * rs * ease, ringR * rs * 0.62 * ease, 0, 0, Math.PI * 2); ctx.stroke();
  }

  // çekirdek (mevcut klasör)
  const coreR = 46;
  const coreGlow = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreR * 3);
  coreGlow.addColorStop(0, c.glow + '0.45)');
  coreGlow.addColorStop(1, c.glow + '0)');
  ctx.fillStyle = coreGlow;
  ctx.beginPath(); ctx.arc(cx, cy, coreR * 3, 0, Math.PI * 2); ctx.fill();
  const coreBody = ctx.createRadialGradient(cx - coreR * 0.3, cy - coreR * 0.3, coreR * 0.1, cx, cy, coreR);
  coreBody.addColorStop(0, '#ffffff'); coreBody.addColorStop(0.3, c.core); coreBody.addColorStop(1, shade(c.core, -0.7));
  ctx.fillStyle = coreBody;
  ctx.beginPath(); ctx.arc(cx, cy, coreR, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = '600 13px -apple-system, sans-serif';
  ctx.textAlign = 'center';
  const coreLabel = planet.rel ? planet.rel.split('/').pop() : p.name;
  ctx.fillText(coreLabel.length > 16 ? coreLabel.slice(0, 15) + '…' : coreLabel, cx, cy + coreR + 22);
  if (planet.rel) {
    ctx.fillStyle = 'rgba(205,214,255,.55)';
    ctx.font = '11px -apple-system, sans-serif';
    ctx.fillText('▲ üst klasör', cx, cy + 4);
  }

  // düğümler
  if (planet.loading) {
    ctx.fillStyle = 'rgba(205,214,255,.6)';
    ctx.font = '13px -apple-system, sans-serif';
    ctx.fillText('yörünge taranıyor…', cx, cy - coreR - 30);
  } else if (!planet.nodes.length && !window.galaxy.list) {
    ctx.fillStyle = 'rgba(205,214,255,.55)';
    ctx.font = '13px -apple-system, sans-serif';
    ctx.fillText('Dosya yörüngesi yalnızca masaüstü uygulamasında görünür', cx, cy - coreR - 30);
  }

  for (const n of planet.nodes) {
    const a = n.a0 + t * n.speed;
    const nr = n.r * rs * ease;
    n.x = cx + Math.cos(a) * nr;
    n.y = cy + Math.sin(a) * nr * 0.62;
    const col = fileColor(n.entry.name, n.entry.dir);
    const isHot = planet.hovered === n;
    const sz = n.size * (isHot ? 1.35 : 1);

    const glow = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, sz * 3);
    glow.addColorStop(0, col.glow + (isHot ? '0.55)' : '0.3)'));
    glow.addColorStop(1, col.glow + '0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(n.x, n.y, sz * 3, 0, Math.PI * 2); ctx.fill();

    const body = ctx.createRadialGradient(n.x - sz * 0.3, n.y - sz * 0.3, sz * 0.1, n.x, n.y, sz);
    body.addColorStop(0, '#fff'); body.addColorStop(0.3, col.core); body.addColorStop(1, shade(col.core, -0.7));
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.arc(n.x, n.y, sz, 0, Math.PI * 2); ctx.fill();

    if (n.entry.dir) {
      ctx.strokeStyle = col.glow + '0.7)';
      ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.ellipse(n.x, n.y, sz * 1.75, sz * 0.62, -0.45, 0, Math.PI * 2); ctx.stroke();
    }

    if (isHot || sz > 13 || planet.nodes.length <= 16) {
      ctx.fillStyle = isHot ? '#fff' : 'rgba(205,214,255,.72)';
      ctx.font = `${isHot ? 600 : 400} 11px -apple-system, sans-serif`;
      const nm = n.entry.name.length > 20 && !isHot ? n.entry.name.slice(0, 19) + '…' : n.entry.name;
      ctx.fillText(nm, n.x, n.y + sz + 15);
    }
  }

  if (planet.extra > 0) {
    ctx.fillStyle = 'rgba(205,214,255,.45)';
    ctx.font = '12px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`+${planet.extra} öğe daha — Ağaç panelinden ulaş`, cx, H - 30);
  }
}

function loop() {
  t += 0.016;
  if (mode === 'space') drawSpace(); else drawPlanet();
  requestAnimationFrame(loop);
}

/* ============================================================
   UZAY ETKİLEŞİMİ
============================================================ */
let dragging = false, moved = false, lastX = 0, lastY = 0;
let hoveredGroup = null;
let lastClickTime = 0, lastClickTarget = null;

spaceCv.addEventListener('mousedown', e => {
  dragging = true; moved = false;
  lastX = e.clientX; lastY = e.clientY;
  vx = vy = 0;
  spaceCv.classList.add('dragging');
});

window.addEventListener('mousemove', e => {
  if (mode === 'space') {
    if (dragging) {
      const dx = (e.clientX - lastX) / cam.z, dy = (e.clientY - lastY) / cam.z;
      cam.tx -= dx; cam.ty -= dy; cam.x -= dx; cam.y -= dy;
      vx = -dx * 0.35; vy = -dy * 0.35;
      if (Math.abs(e.clientX - lastX) + Math.abs(e.clientY - lastY) > 2) moved = true;
      lastX = e.clientX; lastY = e.clientY;
      return;
    }
    if (e.target !== spaceCv) { hovered = null; hoveredGroup = null; return; }
    const [wx, wy] = toWorld(e.clientX, e.clientY);
    hovered = null; hoveredGroup = null;
    for (const p of projects) {
      if (Math.hypot(p.wx - wx, p.wy - wy) < Math.max(p.radius + 20, 30 / cam.z)) { hovered = p; break; }
    }
    if (!hovered && cam.z < 0.5) {
      for (const g of groups) {
        const [gx, gy] = toScreen(g.x, g.y);
        if (Math.abs(e.clientY - g.labelY) < 26 && Math.abs(e.clientX - gx) < 200) { hoveredGroup = g; break; }
        if (Math.hypot(gx - e.clientX, gy - e.clientY) < g.rad * 0.5) { hoveredGroup = g; break; }
      }
    }
    const tip = $('tip');
    if (hovered) {
      tip.style.display = 'block';
      tip.style.left = Math.min(e.clientX + 18, W - 340) + 'px';
      tip.style.top = (e.clientY + 12) + 'px';
      tip.innerHTML = `<b>${esc(hovered.name)}</b><small>${esc(hovered.stage || statusLabel(hovered.status))} · %${hovered.progress}</small>`;
      spaceCv.style.cursor = 'pointer';
    } else {
      tip.style.display = 'none';
      spaceCv.style.cursor = hoveredGroup ? 'pointer' : '';
    }
  } else {
    // gezegen: düğüm hover
    if (e.target !== planetCv) { planet.hovered = null; return; }
    planet.hovered = null;
    let cursor = '';
    for (const n of planet.nodes) {
      if (n.x != null && Math.hypot(n.x - e.clientX, n.y - e.clientY) < Math.max(n.size * 1.8, 18)) {
        planet.hovered = n; cursor = 'pointer'; break;
      }
    }
    if (!planet.hovered && Math.hypot(planet.cx - e.clientX, planet.cy - e.clientY) < 50 && planet.rel) cursor = 'pointer';
    planetCv.style.cursor = cursor;
    const tip = $('tip');
    if (planet.hovered) {
      const en = planet.hovered.entry;
      tip.style.display = 'block';
      tip.style.left = Math.min(e.clientX + 16, W - 340) + 'px';
      tip.style.top = (e.clientY + 12) + 'px';
      tip.innerHTML = `<b>${esc(en.name)}</b><small>${en.dir ? 'klasör — tıkla ve gir' : fmtSize(en.size) + ' — tıkla ve görüntüle'}</small>`;
    } else tip.style.display = 'none';
  }
});

window.addEventListener('mouseup', e => {
  if (mode !== 'space') { dragging = false; return; }
  if (dragging && !moved && e.target === spaceCv) {
    const now = Date.now();
    if (hovered) {
      if (lastClickTarget === hovered && now - lastClickTime < 380) {
        enterPlanet(hovered); // çift tık: direkt in
      } else {
        showCard(hovered);
      }
      lastClickTarget = hovered; lastClickTime = now;
    } else if (hoveredGroup) {
      cam.tx = hoveredGroup.x; cam.ty = hoveredGroup.y; cam.tz = 0.62;
    } else {
      hideCard();
    }
  }
  dragging = false;
  spaceCv.classList.remove('dragging');
});

spaceCv.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = Math.exp(-e.deltaY * 0.0012);
  const nz = Math.min(Math.max(cam.tz * factor, 0.05), 2.4);
  const [wx, wy] = toWorld(e.clientX, e.clientY);
  cam.tx = wx - (e.clientX - W / 2) / nz;
  cam.ty = wy - (e.clientY - H / 2) / nz;
  cam.tz = nz;
  positionCard();
}, { passive: false });

/* --- gezegen tıklama --- */
planetCv.addEventListener('click', e => {
  if (planet.hovered) {
    const en = planet.hovered.entry;
    const rel = planet.rel ? planet.rel + '/' + en.name : en.name;
    if (en.dir) { planet.rel = rel; loadOrbit(); }
    else openFileViewer(rel);
  } else if (Math.hypot(planet.cx - e.clientX, planet.cy - e.clientY) < 50 && planet.rel) {
    goUp();
  }
});
planetCv.addEventListener('contextmenu', e => { e.preventDefault(); goUp(); });
planetCv.addEventListener('wheel', e => {
  e.preventDefault();
  planet.tRingScale = Math.min(1.6, Math.max(0.6, planet.tRingScale * Math.exp(-e.deltaY * 0.001)));
}, { passive: false });

function goUp() {
  if (!planet.rel) return;
  const segs = planet.rel.split('/');
  segs.pop();
  planet.rel = segs.join('/');
  loadOrbit();
}

/* ============================================================
   KLAVYE
============================================================ */
window.addEventListener('keydown', e => {
  const ae = document.activeElement;
  const typing = ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.tagName === 'SELECT');
  if (e.key === 'Escape') {
    if (typing) { ae.blur(); return; }
    if (mode === 'planet') {
      if ($('viewer').classList.contains('open')) closeViewer();
      else if ($('drawer').classList.contains('open')) closeDrawer();
      else if (planet.rel) goUp();
      else exitPlanet();
    } else {
      if (carded) hideCard();
    }
    return;
  }
  if (typing) return;
  if (mode === 'space') {
    const step = 60 / cam.z;
    if (e.key === 'ArrowLeft' || e.key === 'a') cam.tx -= step;
    if (e.key === 'ArrowRight' || e.key === 'd') cam.tx += step;
    if (e.key === 'ArrowUp' || e.key === 'w') cam.ty -= step;
    if (e.key === 'ArrowDown' || e.key === 's') cam.ty += step;
    if (e.key === '+' || e.key === '=') cam.tz = Math.min(2.4, cam.tz * 1.25);
    if (e.key === '-') cam.tz = Math.max(0.05, cam.tz / 1.25);
    if (e.key === 'Enter' && carded) enterPlanet(carded);
  } else {
    if (e.key === 'Backspace') goUp();
  }
});

function showCard(p) {
  carded = p;
  const card = $('card');
  card.querySelector('.cGroup').textContent = p.group + ' · ' + statusLabel(p.status);
  card.querySelector('.cName').textContent = p.name;

  card.querySelector('.cDesc').textContent = p.desc || '';
  card.querySelector('.bar i').style.width = p.progress + '%';
  card.style.display = 'block';
  // gezegene yaklaş
  cam.tz = Math.max(cam.tz, 0.75);
  cam.tx = p.wx; cam.ty = p.wy;
  positionCard();
}
function positionCard() {
  if (!carded) return;
  const [sx, sy] = toScreen(carded.wx, carded.wy);
  const card = $('card');
  let x = sx + 60, y = sy - 80;
  if (x + 340 > W) x = sx - 380;
  y = Math.max(70, Math.min(H - 300, y));
  card.style.left = x + 'px';
  card.style.top = y + 'px';
}
function hideCard() { carded = null; $('card').style.display = 'none'; }
$('cardEnter').addEventListener('click', () => carded && enterPlanet(carded));
$('cardFolder').addEventListener('click', () => carded && window.galaxy.openFolder(carded.path));
setInterval(positionCard, 60);

let viewedPath = null;
async function openFileViewer(rel) {
  if (!window.galaxy.file || !planet.proj.path) return;
  const f = await window.galaxy.file(planet.proj.path, rel);
  if (!f) return;
  viewedPath = f.path;
  $('vName').textContent = f.name;
  $('vMeta').textContent = fmtSize(f.size);
  const body = $('vBody');
  body.innerHTML = '';
  if (f.kind === 'text') {
    const pre = document.createElement('pre');
    pre.className = 'codeview';
    pre.textContent = f.content;
    body.appendChild(pre);
  } else if (f.kind === 'markdown') {
    const div = document.createElement('div');
    div.className = 'mdview';
    div.innerHTML = mdToHtml(f.content);
    body.appendChild(div);
  } else if (f.kind === 'image') {
    body.innerHTML = `<div class="mediaWrap"><img src="${f.url}" alt=""></div>`;
  } else if (f.kind === 'pdf') {
    body.innerHTML = `<iframe src="${f.url}"></iframe>`;
  } else if (f.kind === 'video') {
    body.innerHTML = `<div class="mediaWrap"><video src="${f.url}" controls autoplay></video></div>`;
  } else if (f.kind === 'audio') {
    body.innerHTML = `<div class="mediaWrap"><audio src="${f.url}" controls autoplay></audio></div>`;
  } else {
    body.innerHTML = `<div class="binWrap"><div class="ic">◈</div><div>${esc(f.name)}</div><div>${fmtSize(f.size)} — uygulama içinde önizlenemiyor</div></div>`;
    const b = document.createElement('button');
    b.className = 'btn primary'; b.textContent = 'Varsayılan Uygulamada Aç';
    b.addEventListener('click', () => window.galaxy.openFile(viewedPath));
    body.querySelector('.binWrap').appendChild(b);
  }
  $('viewer').classList.add('open');
}
function closeViewer() { $('viewer').classList.remove('open'); $('vBody').innerHTML = ''; viewedPath = null; }
$('vClose').addEventListener('click', closeViewer);
$('vOpen').addEventListener('click', () => viewedPath && window.galaxy.openFile(viewedPath));

/* ---------- README ---------- */
async function loadReadme() {
  const box = $('readmeBox');
  if (!selected || box.dataset.for === selected.id) return;
  box.dataset.for = selected.id;
  if (!window.galaxy.readme || !selected.path) {
    box.innerHTML = '<span style="color:#5a6699">README yalnızca masaüstü uygulamasında görüntülenir.</span>';
    return;
  }
  box.textContent = 'yükleniyor…';
  const r = await window.galaxy.readme(selected.path);
  box.innerHTML = r ? `<div style="color:#5a6699;font-size:11px;margin-bottom:10px">${esc(r.name)}</div>` + mdToHtml(r.content)
                    : '<span style="color:#5a6699">Bu projede README bulunamadı.</span>';
}

function mdToHtml(md) {
  const lines = md.split('\n');
  let html = '', inCode = false, inList = false;
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '$1');
  for (const raw of lines) {
    if (raw.trim().startsWith('```')) { html += inCode ? '</code></pre>' : '<pre><code>'; inCode = !inCode; continue; }
    if (inCode) { html += esc(raw) + '\n'; continue; }
    const task = raw.match(/^\s*[-*] \[([ xX])\] (.*)/);
    const li = raw.match(/^\s*[-*] (.*)/);
    const h = raw.match(/^(#{1,3}) (.*)/);
    if (!li && !task && inList) { html += '</ul>'; inList = false; }
    if (task) {
      if (!inList) { html += '<ul>'; inList = true; }
      const done = task[1] !== ' ';
      html += `<li class="task ${done ? 'done' : 'todo'}">${done ? '✓' : '○'} ${inline(task[2])}</li>`;
    } else if (li) {
      if (!inList) { html += '<ul>'; inList = true; }
      html += `<li>${inline(li[1])}</li>`;
    } else if (h) {
      html += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`;
    } else if (raw.trim() === '' || /^[-=]{3,}$/.test(raw.trim())) {
    } else {
      html += `<p>${inline(raw)}</p>`;
    }
  }
  if (inList) html += '</ul>';
  if (inCode) html += '</code></pre>';
  return html;
}

/* ---------- dosya ağacı ---------- */
async function loadTree() {
  const box = $('treeBox');
  if (!selected || box.dataset.for === selected.id) return;
  box.dataset.for = selected.id;
  if (!window.galaxy.tree || !selected.path) {
    box.innerHTML = '<span style="color:#5a6699">Dosya ağacı yalnızca masaüstü uygulamasında çalışır.</span>';
    return;
  }
  box.textContent = 'yükleniyor…';
  const tree = await window.galaxy.tree(selected.path);
  box.innerHTML = '';
  if (!tree || !tree.length) { box.textContent = 'boş klasör'; return; }
  box.appendChild(renderTree(tree, '', true));
}
function renderTree(nodes, base, open) {
  const frag = document.createDocumentFragment();
  for (const n of nodes) {
    const rel = base ? base + '/' + n.name : n.name;
    if (n.dir) {
      const det = document.createElement('details');
      if (open) det.open = true;
      const sum = document.createElement('summary');
      sum.textContent = n.name;
      det.appendChild(sum);
      if (n.children && n.children.length) det.appendChild(renderTree(n.children, rel, false));
      frag.appendChild(det);
    } else {
      const div = document.createElement('div');
      div.className = 'file';
      div.textContent = n.name;
      div.title = 'Görüntüle';
      div.addEventListener('click', () => openFileViewer(rel));
      frag.appendChild(div);
    }
  }
  return frag;
}

/* ---------- Claude konsolu ---------- */
let activeRun = null;
function claudeAppend(kind, text) {
  const out = $('claudeOut');
  const span = document.createElement('span');
  span.className = 'c-' + kind;
  span.textContent = (kind === 'tool' ? '\n▸ ' : kind === 'result' ? '\n\n━━ sonuç ━━\n' : kind === 'info' ? '· ' : '') + text + (kind === 'tool' || kind === 'info' ? '' : '\n');
  out.appendChild(span);
  out.scrollTop = out.scrollHeight;
  if (selected) selected._claudeLog = out.innerHTML;
}
if (window.galaxy.onClaude) {
  window.galaxy.onClaude(msg => {
    if (!activeRun || msg.runId !== activeRun) return;
    if (msg.kind === 'done') {
      activeRun = null;
      $('claudeRunBtn').style.display = '';
      $('claudeStopBtn').style.display = 'none';
      $('claudeState').textContent = 'bitti';
      return;
    }
    claudeAppend(msg.kind, msg.text);
  });
}
async function runClaude() {
  if (!selected || !selected.path || activeRun) return;
  if (!window.galaxy.claudeRun) { claudeAppend('err', 'Claude konsolu yalnızca masaüstü uygulamasında çalışır.'); return; }
  const prompt = $('claudePrompt').value.trim();
  if (!prompt) return;
  const runId = String(Date.now());
  activeRun = runId;
  claudeAppend('info', '\n> ' + prompt + '\n');
  $('claudeRunBtn').style.display = 'none';
  $('claudeStopBtn').style.display = '';
  $('claudeState').textContent = 'çalışıyor…';
  const res = await window.galaxy.claudeRun({ runId, cwd: selected.path, prompt, continueSession: $('claudeCont').checked });
  if (!res.ok) {
    claudeAppend('err', res.error || 'başlatılamadı');
    activeRun = null;
    $('claudeRunBtn').style.display = '';
    $('claudeStopBtn').style.display = 'none';
  } else $('claudePrompt').value = '';
}
$('claudeRunBtn').addEventListener('click', runClaude);
$('claudePrompt').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); runClaude(); }
});
$('claudeStopBtn').addEventListener('click', async () => {
  if (activeRun && window.galaxy.claudeStop) {
    await window.galaxy.claudeStop(activeRun);
    claudeAppend('info', 'durduruldu');
  }
});
$('claudeTermBtn').addEventListener('click', () => {
  if (selected && selected.path && window.galaxy.openClaude) window.galaxy.openClaude(selected.path);
});

/* ============================================================
   ARAMA & GENEL BAKIŞ & EVREN
============================================================ */
$('search').addEventListener('input', e => { searchQuery = e.target.value.trim(); });
$('search').addEventListener('keydown', e => {
  if (e.key === 'Enter' && searchQuery) {
    const q = searchQuery.toLowerCase();
    const hit = projects.find(p => p.name.toLowerCase().includes(q) || p.id.toLowerCase().includes(q));
    if (hit) { showCard(hit); e.target.blur(); }
  }
});
$('overviewBtn').addEventListener('click', () => { hideCard(); cam.tx = 0; cam.ty = 0; cam.tz = 0.22; });

const ORB_COLORS = [
  { oc: '#4d7bff', og: 'rgba(77,123,255,.5)' },
  { oc: '#c77bff', og: 'rgba(199,123,255,.5)' },
  { oc: '#5ec8ff', og: 'rgba(94,200,255,.5)' }
];
function showUniversePick() {
  hideCard();
  if (mode === 'planet') exitPlanet();
  const wrap = $('uniCards');
  wrap.innerHTML = '';
  universes.forEach((u, i) => {
    const card = document.createElement('div');
    card.className = 'uniCard';
    card.style.setProperty('--oc', ORB_COLORS[i % ORB_COLORS.length].oc);
    card.style.setProperty('--og', ORB_COLORS[i % ORB_COLORS.length].og);
    const count = allProjects.filter(p => p.universe === u.id).length;
    card.innerHTML = `<div class="orb"></div><b>${esc(u.name)}</b><small>${esc(u.subtitle)}</small><span class="cnt">${count} proje</span>`;
    card.addEventListener('click', () => enterUniverse(u.id));
    wrap.appendChild(card);
  });
  $('universePick').classList.remove('hidden');
}
function enterUniverse(id) {
  currentUni = id;
  const u = universes.find(x => x.id === id);
  $('uniLabel').textContent = u ? u.name : '';
  localStorage.setItem('lastUniverse', id);
  layout();
  $('universePick').classList.add('hidden');
  warpFlash();
  cam.x = 0; cam.y = 0; cam.z = 0.02;
  cam.tx = 0; cam.ty = 0; cam.tz = 0.22;
}
$('switchUniBtn').addEventListener('click', showUniversePick);

/* ============================================================
   BAŞLAT
============================================================ */
async function init() {
  let data;
  try {
    data = await window.galaxy.load();
  } catch (err) {
    document.querySelector('#intro p').textContent = 'HATA: ' + err.message;
    return;
  }
  universes = data.universes;
  allProjects = data.projects;
  $('hint').textContent = 'sürükle: gezin · tekerlek: yakınlaş · tık: bilgi · çift tık: gezegene in';
  loop();
  setTimeout(() => {
    const intro = $('intro');
    intro.style.opacity = '0';
    setTimeout(() => intro.remove(), 1100);
    showUniversePick();
  }, 600);
}
init();
</script>
