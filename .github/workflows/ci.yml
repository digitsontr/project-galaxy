name: CI

# Her push ve PR'da arayüzü derle + smoke test çalıştır (bozuk kod erken yakalansın).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Bağımlılıkları kur
        run: npm install --no-audit --no-fund
      - name: Arayüzü derle
        run: python3 newui/build.py
      - name: Swift STT derleme kontrolü (opsiyonel)
        run: |
          if command -v swiftc >/dev/null 2>&1; then
            swiftc native/galaxy-stt.swift -O -o /tmp/galaxy-stt && echo "✓ galaxy-stt derlendi"
          fi
      - name: Smoke test
        run: |
          set -o pipefail
          env -u ELECTRON_RUN_AS_NODE ./node_modules/.bin/electron test/smoke.js 2>/dev/null | tee smoke.log
          grep -q "geçti" smoke.log && ! grep -q "BAŞARISIZ" smoke.log
