name: Release

# v* tag'i push edilince (ör. v2.4.0) macOS'ta build + smoke + imzala + notarize + Release yayınla.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bağımlılıkları kur
        run: npm install --no-audit --no-fund

      - name: Arayüzü derle
        run: python3 newui/build.py

      - name: Smoke test (paketlemeden önce güvence)
        run: |
          set -o pipefail
          env -u ELECTRON_RUN_AS_NODE ./node_modules/.bin/electron test/smoke.js 2>/dev/null | tee smoke.log
          if grep -q "BAŞARISIZ" smoke.log || ! grep -q "geçti" smoke.log; then
            echo "::error::Smoke test başarısız — release durduruldu."
            exit 1
          fi

      - name: Build + imzala + notarize (electron-builder)
        env:
          # Developer ID imzalama sertifikası (.p12 → base64) + parolası
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          # Notarization kimlik bilgileri (Apple ID + uygulamaya özel parola + Team ID)
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx --yes electron-builder --mac --publish never

      - name: Release yayınla (dmg + zip)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
          generate_release_notes: true
          body: |
            ## Project Galaxy ${{ github.ref_name }}

            **Kurulum:** `.dmg`'yi indir, aç, `Project Galaxy`'yi **Applications**'a sürükle → çift tıkla.
            İmzalı + Apple tarafından notarize edilmiştir — Gatekeeper uyarısı çıkmaz, direkt açılır. ✅

            > Uygulama içi otomatik güncelleme `.zip`'i kullanır; sen sadece `.dmg`'yi indir.
