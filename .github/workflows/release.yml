name: Release

# v* tag'i push edilince (ör. v2.4.0) macOS'ta build + smoke + imzala + notarize + Release yayınla.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bağımlılıkları kur
        run: npm install --no-audit --no-fund

      - name: Arayüzü derle
        run: python3 newui/build.py

      - name: Smoke test (paketlemeden önce güvence)
        run: |
          set -o pipefail
          env -u ELECTRON_RUN_AS_NODE ./node_modules/.bin/electron test/smoke.js 2>/dev/null | tee smoke.log
          if grep -q "BAŞARISIZ" smoke.log || ! grep -q "geçti" smoke.log; then
            echo "::error::Smoke test başarısız — release durduruldu."
            exit 1
          fi

      - name: Build + imzala + notarize (electron-builder)
        env:
          # Developer ID imzalama sertifikası (.p12 → base64) + parolası
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          # Notarization kimlik bilgileri (Apple ID + uygulamaya özel parola + Team ID)
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx --yes electron-builder --mac --publish never

      - name: Release yayınla (dmg + zip)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
          generate_release_notes: true
          body: |
            ## Project Galaxy ${{ github.ref_name }}

            ### 🍎 macOS (Apple Silicon)
            `.dmg`'yi indir, aç, `Project Galaxy`'yi **Applications**'a sürükle → çift tıkla.
            İmzalı + Apple notarize'lı — Gatekeeper uyarısı çıkmaz, direkt açılır. ✅

            ### 🪟 Windows (x64)
            `Project-Galaxy-Setup-*.exe`'yi indir, çalıştır, kurulum sihirbazını izle.
            İlk açılışta Windows **"korudu"** derse → **Daha fazla bilgi → Yine de çalıştır** (imzasız derleme, tek seferlik).
            Gömülü terminal için **Git for Windows** (bash) ve AI için **Claude Code** kurulu olmalı.

            > Uygulama içi otomatik güncelleme macOS'ta `.zip`'i kullanır.

  build-windows:
    runs-on: windows-latest
    needs: build-macos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bağımlılıkları kur
        run: npm install --no-audit --no-fund
      - name: Arayüzü derle
        run: python newui/build.py
      - name: Windows .exe installer (electron-builder)
        run: npx --yes electron-builder --win --publish never
      - name: Release'e .exe ekle
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
