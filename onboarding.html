<!DOCTYPE html>
<html lang="tr" data-theme="apex">
<head>
<meta charset="utf-8">
<title>Project Galaxy</title>
<style>
  :root {
    --bg: #0f1217;
    --panel: #151921;
    --line: rgba(255, 255, 255, .1);
    --ink: #e6ebf2;
    --dim: #95a0b0;
    --faint: #677284;
    --cy: #58a6ff;
    --gx-bg: #0f1217;
    --gx-panel: #151921;
    --gx-panel-2: #11151c;
  }
  html[data-theme="ev"] {
    --bg: #14110e;
    --cy: #e8b86d;
    --ink: #f3eadc;
    --dim: #b8a894;
    --faint: #7a6e5c;
    --line: rgba(232,184,109,.16);
    --gx-bg: #14110e;
    --gx-panel: #1c1814;
    --gx-panel-2: #161310;
  }
  html[data-theme="apex"] {
    --bg: #0f1217;
    --cy: #58a6ff;
    --ink: #e6ebf2;
    --dim: #95a0b0;
    --faint: #677284;
    --line: rgba(255, 255, 255, .1);
    --gx-bg: #0f1217;
    --gx-panel: #151921;
    --gx-panel-2: #11151c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink); overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  canvas#stars, #nebula { display: none; }
  @keyframes nebDrift { from { transform: translate(0, 0) scale(1); } to { transform: translate(-2.5%, -2%) scale(1.06); } }
  .drag { position: fixed; top: 0; left: 0; right: 0; height: 38px; -webkit-app-region: drag; z-index: 5; }
  .wrap {
    position: relative; z-index: 1; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 48px 64px 40px;
  }
  .mono { font-family: Menlo, "JetBrains Mono", monospace; }
  .hud { font-size: 11px; letter-spacing: .08em; color: var(--cy); text-transform: uppercase; font-weight: 600; }
  .title { font-size: 24px; font-weight: 600; letter-spacing: -.01em; margin: 8px 0 6px; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 22px; text-align: center; max-width: 520px; line-height: 1.55; }
  .card {
    width: 640px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 26px 28px;
    max-height: 320px; overflow-y: auto;
  }
  .row { display: flex; gap: 12px; }
  .grow { flex: 1; }
  input[type=text] {
    width: 100%; background: var(--gx-panel-2); border: 1px solid var(--line);
    color: var(--ink); padding: 11px 14px; font-size: 14px; outline: none; border-radius: 8px;
    font-family: inherit; -webkit-user-select: text; user-select: text;
  }
  input[type=text]:focus { border-color: var(--cy); }
  .btn {
    display: inline-block; border: 1px solid var(--line); color: var(--ink); background: var(--panel);
    padding: 10px 22px; font-size: 12px; font-weight: 600; letter-spacing: .04em; cursor: pointer; border-radius: 8px;
    font-family: inherit; transition: all .15s;
  }
  .btn:hover { border-color: var(--cy); color: var(--cy); }
  .btn.solid { background: var(--cy); color: #08111d; border-color: var(--cy); font-weight: 600; }
  .btn.solid:hover { filter: brightness(1.08); color: #08111d; }
  .btn:disabled { opacity: .35; cursor: default; }
  .nav { display: flex; justify-content: space-between; align-items: center; width: 640px; margin-top: 22px; }
  .dots { display: flex; gap: 8px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); transition: background .2s; }
  .dot.on { background: var(--cy); }
  .langCards { display: flex; gap: 18px; justify-content: center; }
  .langCard {
    width: 210px; padding: 24px 20px; text-align: center; cursor: pointer;
    background: var(--panel); border: 1px solid rgba(255, 255, 255, .14); border-radius: 10px; transition: all .15s;
  }
  .langCard:hover, .langCard.sel { border-color: var(--cy); background: rgba(88, 166, 255, .1); box-shadow: 0 0 0 1px var(--cy); }
  .langCard .flag { font-size: 30px; margin-bottom: 10px; }
  .langCard .name { font-size: 14px; font-weight: 600; letter-spacing: .04em; color: var(--ink); }
  .uniRow {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 7px; margin-bottom: 10px; background: var(--gx-panel-2);
  }
  .uniRow .path { color: var(--faint); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
  .uniRow input { padding: 7px 10px; font-size: 13px; }
  /* --- evren kartları: artifact "Evrenini seç" kart-grid + gezegen küre dili --- */
  .uniGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 14px; }
  .uniCard {
    position: relative; padding: 18px 18px 16px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--gx-panel-2);
    transition: border-color .15s, box-shadow .15s;
  }
  .uniCard:hover { border-color: var(--cy); }
  .uniCard .planet {
    width: 52px; height: 52px; border-radius: 50%; margin-bottom: 15px;
    transition: transform .3s cubic-bezier(.34,1.56,.5,1);
  }
  .uniCard:hover .planet { transform: scale(1.06); }
  .uniCard .un {
    width: 100%; background: transparent; border: none; outline: none;
    color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 17px; font-weight: 600; letter-spacing: .01em; padding: 0; margin-bottom: 5px;
  }
  .uniCard .un:focus { color: #fff; }
  .uniCard .pth {
    font-family: Menlo, "JetBrains Mono", monospace; font-size: 10.5px; color: var(--faint);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left;
    margin-bottom: 11px;
  }
  .uniCard .st { font-family: Menlo, "JetBrains Mono", monospace; font-size: 10px; color: var(--dim); letter-spacing: .04em; }
  .uniCard .st b { color: var(--ink); font-weight: 600; }
  .uniCard .rm {
    position: absolute; top: 12px; right: 13px; color: var(--faint); cursor: pointer;
    font-size: 13px; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center;
    border-radius: 5px; transition: color .15s, background .15s;
  }
  .uniCard .rm:hover { color: #ff8b8b; background: rgba(255,139,139,.1); }
  .uniCard.add {
    border-style: dashed; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; cursor: pointer; min-height: 150px; clip-path: none; border-radius: 10px;
    color: var(--dim);
  }
  .uniCard.add:hover { border-color: var(--cy); color: var(--cy); }
  .uniCard.add .plus { font-size: 26px; font-weight: 200; margin-bottom: 8px; color: var(--cy); }
  .uniCard.add .lbl { font-family: Menlo, monospace; font-size: 10px; letter-spacing: .18em; }
  .uniCard.add .sub2 { font-family: Menlo, monospace; font-size: 9px; letter-spacing: .1em; color: var(--faint); margin-top: 5px; }
  .x { color: var(--faint); cursor: pointer; font-size: 15px; padding: 4px 7px; }
  .x:hover { color: #ff8b8b; }
  .agentRow { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .agentDot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .agentRow input.nm { width: 170px; }
  .hint { color: var(--faint); font-size: 11px; margin-top: 12px; line-height: 1.5; }
  .err { color: #ff8b8b; font-size: 12px; margin-top: 10px; min-height: 16px; }
  .fade { animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .sumLine { display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px solid rgba(120,160,255,.08); font-size: 13px; }
  .sumLine .k { color: var(--faint); width: 130px; flex: none; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; padding-top: 2px; }
  .connGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .connCard { border: 1px solid var(--line); border-radius: 10px; padding: 12px 13px; text-align: left; background: rgba(8,14,28,.45); }
  .connCard .t { font-size: 13px; font-weight: 600; color: var(--cy); margin-bottom: 5px; }
  .connCard .b { font-size: 12px; color: var(--dim); line-height: 1.45; }
  .connCard .w { font-family: Menlo, "JetBrains Mono", monospace; font-size: 10px; color: var(--faint); margin-top: 8px; letter-spacing: .02em; line-height: 1.4; }
  .connNote { font-size: 12px; color: var(--dim); margin-top: 12px; line-height: 1.5; }
  .card.wide { width: 640px; max-height: 380px; }

  /* --- tanıtım görselleri (docs/Project_Galaxy_Mission_Control.pdf) --- */
  .illus {
    position: relative; width: 640px; height: 132px; margin: 0 0 18px;
    border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
    background: #05080f; cursor: zoom-in; flex: none;
    box-shadow: 0 12px 38px rgba(0, 0, 0, .5);
  }
  .illus img { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; }
  .illus:hover { border-color: var(--cy); }
  .illus .zoom {
    position: absolute; right: 8px; bottom: 8px; font-family: Menlo, monospace;
    font-size: 8px; letter-spacing: .2em; color: var(--cy); opacity: 0; transition: opacity .15s;
    background: rgba(4, 8, 20, .82); border: 1px solid rgba(97, 220, 255, .35);
    border-radius: 5px; padding: 3px 8px;
  }
  .illus:hover .zoom { opacity: 1; }
  #lb {
    position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center;
    background: rgba(2, 4, 12, .93); backdrop-filter: blur(6px); cursor: zoom-out; padding: 4vh 4vw;
  }
  #lb.on { display: flex; }
  #lb img { max-width: 100%; max-height: 100%; border-radius: 12px; border: 1px solid var(--line); }
  .agentRow .av {
    width: 34px; height: 34px; flex: none; border-radius: 9px; object-fit: cover;
    border: 1px solid var(--line); background: #0b1330;
  }

  /* --- erişilebilirlik --- */
  .btn:focus-visible, .langCard:focus-visible, .illus:focus-visible,
  input[type=text]:focus-visible {
    outline: 2px solid var(--cy); outline-offset: 2px;
  }
  @media (prefers-reduced-motion: reduce) {
    #nebula { animation: none !important; }
    .fade { animation: none !important; }
    .pulse { animation: none !important; }
  }

  /* --- ayarlar: tercih penceresi (onboarding sihirbazından ayrı) --- */
  @font-face{font-family:'Space Grotesk';font-style:normal;font-weight:300 700;font-display:swap;src:url("newui/assets/fonts/f02-750e0dbba1.woff2") format('woff2')}
  @font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:300 700;font-display:swap;src:url("newui/assets/fonts/f08-17e10d2ba2.woff2") format('woff2')}
  body.prefs {
    font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    background: var(--gx-bg);
  }
  body.prefs .wrap { display: none !important; }
  body.prefs .drag { display: none; }
  body.prefs canvas#stars, body.prefs #nebula { display: none; }
  #prefs {
    position: relative; z-index: 2; height: 100%;
    display: grid; grid-template-rows: 52px 1fr 58px;
    background: var(--gx-panel, #0d1324);
  }
  .prefs-top {
    display: flex; align-items: center; gap: 12px;
    padding: 0 22px 0 78px;
    border-bottom: 1px solid var(--line);
    background: var(--gx-panel, #0d1324);
    -webkit-app-region: drag;
  }
  html[data-platform="win32"] .prefs-top, html[data-platform="linux"] .prefs-top { padding: 0 150px 0 22px; }
  .prefs-top .mark {
    width: 9px; height: 9px; background: var(--cy);
    box-shadow: 0 0 12px var(--cy); transform: rotate(45deg); flex: none;
  }
  .prefs-top .brand {
    font-weight: 600; letter-spacing: .16em; font-size: 13px; color: var(--ink);
  }
  .prefs-top .hud {
    font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: .22em;
    color: var(--cy); margin-left: 4px;
  }
  .prefs-top .ver {
    margin-left: auto; font-family: "JetBrains Mono", monospace;
    font-size: 10px; color: var(--faint); -webkit-app-region: no-drag;
  }
  .prefs-body {
    display: grid; grid-template-columns: 212px 1fr; min-height: 0;
  }
  .prefs-nav {
    border-right: 1px solid var(--line);
    padding: 14px 10px;
    display: flex; flex-direction: column; gap: 3px;
    background: var(--gx-panel-2, #0a101c);
  }
  .theme-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; max-width: 720px; }
  .theme-card {
    -webkit-app-region: no-drag;
    text-align: left; cursor: pointer; border-radius: 14px;
    border: 1px solid var(--line); background: var(--gx-panel-2, #0a101c);
    padding: 12px; font-family: inherit; color: var(--ink);
    transition: border-color .2s, box-shadow .2s;
  }
  .theme-card:hover { border-color: rgba(97,220,255,.28); }
  html[data-theme="ev"] .theme-card:hover { border-color: rgba(232,184,109,.35); }
  .theme-card.on {
    border-color: var(--cy);
    box-shadow: 0 0 0 1px var(--cy), 0 8px 28px rgba(0,0,0,.28);
  }
  .theme-card .lab { font-size: 15px; font-weight: 600; margin-top: 10px; }
  .theme-card .sub { font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: .06em; color: var(--dim); margin-top: 2px; }
  .theme-preview { height: 88px; border-radius: 10px; position: relative; overflow: hidden; }
  .theme-preview.galaxy {
    background:
      radial-gradient(40% 50% at 20% 80%, rgba(97,220,255,.35), transparent 70%),
      radial-gradient(50% 40% at 85% 20%, rgba(70,132,246,.3), transparent 70%),
      linear-gradient(180deg, #0a1228, #05080f);
  }
  .theme-preview.ev {
    background:
      linear-gradient(180deg, transparent 74%, #6a4a2a 74.5%, #4a321c 100%),
      linear-gradient(90deg, #e7f3ff 0 18%, transparent 18%),
      repeating-linear-gradient(90deg, rgba(90,60,30,.1) 0 2px, transparent 2px 28px),
      linear-gradient(180deg, #d4b07a, #a07848);
  }
  .theme-preview.ev::before {
    content:""; position:absolute; left:22%; top:12%; right:8%; bottom:28%;
    background:#c9a06a; border:4px solid #5a3a22;
  }
  .theme-preview.ev::after {
    content:""; position:absolute; left:28%; top:22%; width:20%; height:32%;
    background:#f3e6c4; box-shadow: 28px 10px 0 #efe0b8, 12px 38px 0 #e8d5a8;
    transform:rotate(-6deg); z-index:1;
  }
  .theme-preview.apex {
    background:
      linear-gradient(rgba(79,224,255,.12) 1px, transparent 1px),
      linear-gradient(90deg, rgba(79,224,255,.12) 1px, transparent 1px),
      radial-gradient(50% 40% at 70% 30%, rgba(79,224,255,.32), transparent 70%),
      linear-gradient(180deg, #05070c, #020308);
    background-size: 14px 14px, 14px 14px, auto, auto;
  }
  .theme-preview.apex::after {
    content:""; position:absolute; left:14%; top:22%; width:34%; height:38%;
    border:1px solid rgba(79,224,255,.55); border-radius:8px;
    box-shadow: 42px 16px 0 -1px rgba(79,224,255,.28), 0 0 16px rgba(79,224,255,.25);
  }
  .prefs-nav button {
    -webkit-app-region: no-drag;
    display: flex; align-items: center; gap: 10px;
    width: 100%; text-align: left; cursor: pointer;
    background: transparent; border: 1px solid transparent;
    color: var(--dim); border-radius: 10px;
    padding: 10px 12px; font-family: inherit; font-size: 13.5px;
    transition: border-color .15s, background .15s, color .15s;
  }
  .prefs-nav button:hover { color: var(--ink); background: rgba(97,220,255,.05); }
  .prefs-nav button.on {
    color: var(--cy); border-color: rgba(97,220,255,.28);
    background: rgba(97,220,255,.08);
  }
  .prefs-nav .ico {
    width: 22px; text-align: center; font-size: 13px; opacity: .85; flex: none;
  }
  .prefs-nav .sub {
    font-family: "JetBrains Mono", monospace; font-size: 9px;
    letter-spacing: .08em; color: var(--faint); margin-top: 1px;
  }
  .prefs-main { overflow: auto; padding: 28px 36px 40px; }
  .prefs-main::-webkit-scrollbar { width: 8px; }
  .prefs-main::-webkit-scrollbar-thumb { background: rgba(190,205,255,.22); border-radius: 4px; }
  .pane-hud {
    font-family: "JetBrains Mono", monospace; font-size: 10px;
    letter-spacing: .28em; color: var(--cy); text-transform: uppercase;
    margin-bottom: 8px; display: flex; align-items: center; gap: 8px;
  }
  .pulse {
    width: 7px; height: 7px; border-radius: 50%; background: #55e88b;
    box-shadow: 0 0 8px rgba(85,232,139,.7);
    animation: gxpulse 2s ease-in-out infinite; flex: none;
  }
  .pulse.warn { background: #ffc861; box-shadow: 0 0 8px rgba(255,200,97,.55); }
  .pulse.off { background: var(--faint); box-shadow: none; animation: none; }
  @keyframes gxpulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  .pane-title { font-size: 26px; font-weight: 500; letter-spacing: -.02em; margin-bottom: 6px; }
  .pane-lead { color: var(--dim); font-size: 13.5px; line-height: 1.55; max-width: 52ch; margin-bottom: 26px; }
  .fld { margin-bottom: 22px; }
  .fld .lab { display: block; font-size: 13.5px; font-weight: 500; color: var(--ink); margin-bottom: 4px; }
  .fld .hint { font-size: 12.5px; color: var(--dim); line-height: 1.5; margin-bottom: 10px; }
  .fld input[type=text], .fld textarea, #prefs textarea, #prefs input[type=text] {
    width: 100%; background: rgba(8,12,28,.72);
    border: 1px solid rgba(120,160,255,.22);
    color: var(--ink); padding: 12px 14px; font-size: 14px;
    outline: none; border-radius: 10px;
    font-family: inherit; -webkit-user-select: text; user-select: text;
    transition: border-color .15s, box-shadow .15s;
  }
  #prefs textarea {
    resize: vertical; min-height: 108px; line-height: 1.55;
  }
  #prefs input[type=text]:focus, #prefs textarea:focus {
    border-color: var(--cy); box-shadow: 0 0 0 3px rgba(97,220,255,.12);
  }
  .seg {
    display: inline-flex; border: 1px solid rgba(190,205,255,.18);
    border-radius: 10px; overflow: hidden; background: rgba(4,6,12,.4);
  }
  .seg button {
    background: transparent; border: none; color: var(--dim);
    padding: 10px 18px; font-size: 13px; cursor: pointer;
    font-family: inherit; letter-spacing: .02em;
    transition: background .15s, color .15s;
  }
  .seg button + button { border-left: 1px solid rgba(190,205,255,.14); }
  .seg button.on { background: rgba(97,220,255,.14); color: var(--cy); font-weight: 600; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .stat {
    border: 1px solid var(--line); border-radius: 14px;
    background: linear-gradient(172deg, rgba(13,18,36,.72), rgba(5,8,18,.8));
    padding: 16px 18px;
  }
  .stat .k { font-size: 12.5px; color: var(--dim); margin-bottom: 8px; }
  .stat input {
    font-family: "JetBrains Mono", monospace !important;
    font-size: 28px !important; letter-spacing: .04em; color: var(--cy) !important;
    padding: 4px 0 !important; background: transparent !important; border: none !important;
    box-shadow: none !important; border-radius: 0 !important;
  }
  .stat .u { font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: .12em; color: var(--faint); text-transform: uppercase; }
  .prefs-foot {
    display: flex; align-items: center; gap: 14px;
    padding: 0 22px 0 22px;
    border-top: 1px solid var(--line);
    background: var(--gx-panel, #0d1324);
  }
  html[data-theme="ev"] .prefs-foot .save { color: #211a05; }
  html[data-theme="ev"] #prefs input[type=text]:focus, html[data-theme="ev"] #prefs textarea:focus {
    box-shadow: 0 0 0 3px rgba(232,184,109,.16);
  }
  html[data-theme="ev"] .fld input[type=text], html[data-theme="ev"] .fld textarea, html[data-theme="ev"] #prefs textarea, html[data-theme="ev"] #prefs input[type=text] {
    background: rgba(28,22,16,.92); border-color: rgba(232,184,109,.22);
  }
  .prefs-foot .meta {
    font-family: "JetBrains Mono", monospace; font-size: 10.5px;
    color: var(--faint); line-height: 1.45; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .prefs-foot .save {
    margin-left: auto; -webkit-app-region: no-drag;
    background: var(--cy); color: #04121c; border: 1px solid var(--cy);
    padding: 10px 22px; font-size: 13px; font-weight: 600;
    letter-spacing: .04em; cursor: pointer; border-radius: 10px;
    font-family: inherit;
  }
  .prefs-foot .save:hover { filter: brightness(1.12); }
  .prefs-foot .save:disabled { opacity: .4; cursor: default; }
  .prefs-err { color: #ff8b8b; font-size: 12px; min-height: 0; }
  .mono-in { font-family: "JetBrains Mono", monospace !important; font-size: 12.5px !important; }
  .prefs-nav .lab { font-size: 13.5px; font-weight: 500; }
  .btn-ghost {
    -webkit-app-region: no-drag;
    flex: none; white-space: nowrap;
    background: transparent; color: var(--cy);
    border: 1px solid color-mix(in srgb, var(--cy) 45%, transparent);
    padding: 10px 14px; font-size: 13px; font-weight: 600;

(() => {
  const c = document.getElementById('stars'), x = c.getContext('2d');
  let stars = [];
  function size() {
    c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio;
    stars = Array.from({ length: 160 }, () => ({
      x: Math.random() * c.width, y: Math.random() * c.height,
      r: Math.random() * 1.4 + .2, p: Math.random() * Math.PI * 2, s: Math.random() * .015 + .004
    }));
  }
  size(); addEventListener('resize', size);
  (function tick() {
    x.clearRect(0, 0, c.width, c.height);
    for (const st of stars) {
      st.p += st.s;
      x.globalAlpha = .25 + Math.abs(Math.sin(st.p)) * .6;
      x.fillStyle = '#cfe4ff';
      x.beginPath(); x.arc(st.x, st.y, st.r * devicePixelRatio, 0, 7); x.fill();
    }
    requestAnimationFrame(tick);
  })();
})();

const qs = new URLSearchParams(location.search);
const MODE = qs.get('mode') === 'settings' ? 'settings' : 'onboard';
const PANE_OK = { profil:1, asistan:1, araclar:1, posta:1, hakkinda:1 };
const state = { step: 0, lang: 'tr', name: '', universes: [], agents: [], isMas: false,
  dataDir: '', version: '',
  claudePath: '', terminalApp: 'Terminal', sshTimeout: 8,
  uiTheme: 'apex', setPane: PANE_OK[qs.get('pane')] ? qs.get('pane') : 'profil' };
function applyPrefsTheme() {
  document.documentElement.dataset.theme = 'apex';
  document.body.dataset.theme = 'apex';
}
const $ = id => document.getElementById(id);
const T = () => STR[state.lang];

async function init() {
  try {
    if (MODE === 'settings') {
      const sg = await window.galaxy.settingsGet();
      state.lang = (sg.profile && sg.profile.lang) || 'tr';
      state.name = (sg.profile && sg.profile.name) || '';
      state.claudePath = sg.settings.claudePath || '';
      state.terminalApp = sg.settings.terminalApp || 'Terminal';
      state.sshTimeout = sg.settings.sshTimeout || 8;
      state.assistantBio = sg.settings.assistantBio || '';
      const srv = (sg.settings.mcpServers && sg.settings.mcpServers[0]) || {};
      state.mcpCommand = srv.command || '';
      state.mcpArgs = Array.isArray(srv.args) ? srv.args.join(' ') : (srv.args || '');
      state.mcpEnv = srv.env && typeof srv.env === 'object' ? Object.keys(srv.env).map(k => k + '=' + srv.env[k]).join('\n') : '';
      state.mailBriefTool = sg.settings.mailBriefTool || '';
      state.mailSendTool = sg.settings.mailSendTool || '';
      state.mailTo = sg.settings.mailTo || '';
      state.mailListTool = sg.settings.mailListTool || '';
      state.mailReadTool = sg.settings.mailReadTool || '';
      state.uiTheme = 'apex';
      applyPrefsTheme();
      state.dataDir = sg.dataDir || '';
      state.version = sg.version || '';
      state.isMas = !!sg.isMas;
    } else {
      const st = await window.galaxy.onboardStatus();
      state.lang = (st.profile && st.profile.lang) || 'tr';
      state.name = (st.profile && st.profile.name) || '';
      state.universes = (st.universes || []).map(u => ({ name: u.name, root: u.root, bookmark: null }));
      state.agents = st.agents || [];
      state.isMas = !!st.isMas;
    }
  } catch (e) {}
  try {
    if (MODE === 'settings' && window.galaxy && window.galaxy.onSettingsPane) {
      window.galaxy.onSettingsPane(pane => { if (PANE_OK[pane]) { harvestSettings(); state.setPane = pane; renderSettings(); } });
    }
  } catch (e) {}
  if (MODE === 'settings') {
    document.body.classList.add('prefs');
    const wrap = $('onboardWrap'); if (wrap) wrap.hidden = true;
    const prefs = $('prefs'); if (prefs) prefs.hidden = false;
    renderSettings();
  } else render();
}

function harvestSettings() {
  const v = id => { const el = $(id); return el ? el.value : undefined; };
  const n = v('setName'); if (n !== undefined) state.name = n;
  const bio = v('setBio'); if (bio !== undefined) state.assistantBio = bio;
  const cl = v('setClaude'); if (cl !== undefined) state.claudePath = cl;
  const ss = v('setSshTo'); if (ss !== undefined) { const n = parseInt(ss, 10); if (!isNaN(n)) state.sshTimeout = n; }
  const mc = v('setMcpCmd'); if (mc !== undefined) state.mcpCommand = mc;
  const ma = v('setMcpArgs'); if (ma !== undefined) state.mcpArgs = ma;
  const me = v('setMcpEnv'); if (me !== undefined) state.mcpEnv = me;
  const mb = v('setMailBrief'); if (mb !== undefined) state.mailBriefTool = mb;
  const ms = v('setMailSend'); if (ms !== undefined) state.mailSendTool = ms;
  const ml = v('setMailList'); if (ml !== undefined) state.mailListTool = ml;
  const mr = v('setMailRead'); if (mr !== undefined) state.mailReadTool = mr;
  const mt = v('setMailTo'); if (mt !== undefined) state.mailTo = mt;
}

function setPane(id) {
  harvestSettings();
  state.setPane = id;
  renderSettings();
}

      <div class="lab">${tr ? 'Varsayılan alıcı' : 'Default recipient'}</div>
      <div class="hint">${tr ? 'Gönder aracı to/subject/body ister — Galaxy metni bu adrese yollar.' : 'Send tools need to/subject/body — Galaxy addresses the text here.'}</div>
      <input type="text" id="setMailTo" class="mono-in" value="${esc(state.mailTo || '')}" placeholder="ad@ornek.com" spellcheck="false">
    </div>`;
  }
  return `
    <div class="pane-title">${tr ? 'Hakkında' : 'About'}</div>
    <div class="pane-lead">${tr ? 'Sürüm ve veri klasörü. Evrenler ve ajanlar uygulama içinden düzenlenir.' : 'Version and data folder. Universes and agents are edited inside the app.'}</div>
    <div class="kv">
      <div class="k">${tr ? 'Sürüm' : 'Version'}</div>
      <div class="v">v${esc(state.version || '')}${state.isMas ? ' · App Store' : ''}</div>
      <div class="k">${tr ? 'Veri' : 'Data'}</div>
      <div class="v">${esc(state.dataDir || '')}</div>
    </div>`;
}

function renderSettings() {
  const tr = state.lang !== 'en';
  const pane = state.setPane || 'profil';
  const nav = [
    ['profil', tr ? 'Profil' : 'Profile', tr ? 'isim / dil' : 'name / lang'],
    ['asistan', tr ? 'Asistan' : 'Assistant', tr ? 'kişilik / ses' : 'persona / voice'],
    ['araclar', tr ? 'Araçlar' : 'Tools', 'claude / github / ssh'],
    ['posta', tr ? 'Posta' : 'Mail', 'MCP'],
    ['hakkinda', tr ? 'Hakkında' : 'About', tr ? 'sürüm / veri' : 'version / data']
  ];
  const host = $('prefs');
  host.innerHTML = `
    <div class="prefs-top">
      <span class="mark"></span>
      <span class="brand">Kaptan</span>
      <span class="hud">${tr ? 'AYARLAR' : 'SETTINGS'}</span>
      <span class="ver">v${esc(state.version)}${state.isMas ? ' · App Store' : ''}</span>
    </div>
    <div class="prefs-body">
      <div class="prefs-nav">
        ${nav.map(([id, lab, sub]) => `<button type="button" class="${pane === id ? 'on' : ''}" data-pane="${id}">
          <span><div class="lab">${lab}</div><div class="sub">${sub}</div></span>
        </button>`).join('')}
      </div>
      <div class="prefs-main fade">${paneHtml(tr)}</div>
    </div>
    <div class="prefs-foot">
      <div class="meta" title="${esc(state.dataDir)}">${esc(state.dataDir)}</div>
      <div class="prefs-err" id="prefsErr"></div>
      <button type="button" class="save" id="prefsSave">${tr ? 'Kaydet' : 'Save'}</button>
    </div>`;
  host.querySelectorAll('[data-pane]').forEach(b => b.addEventListener('click', () => setPane(b.dataset.pane)));
  const bind = (id, fn) => { const el = $(id); if (el) el.addEventListener('input', fn); };
  bind('setName', e => { state.name = e.target.value; });
  bind('setBio', e => { state.assistantBio = e.target.value; });
  bind('setClaude', e => { state.claudePath = e.target.value; });
  bind('setMcpCmd', e => { state.mcpCommand = e.target.value; });
  bind('setMcpArgs', e => { state.mcpArgs = e.target.value; });
  bind('setMcpEnv', e => { state.mcpEnv = e.target.value; });
  bind('setMailBrief', e => { state.mailBriefTool = e.target.value; });
  bind('setMailSend', e => { state.mailSendTool = e.target.value; });
  bind('setMailTo', e => { state.mailTo = e.target.value; });
  bind('setMailList', e => { state.mailListTool = e.target.value; });
  bind('setMailRead', e => { state.mailReadTool = e.target.value; });
  const lt = $('langTr'), le = $('langEn');
  if (lt) lt.addEventListener('click', () => { harvestSettings(); state.lang = 'tr'; renderSettings(); });
  if (le) le.addEventListener('click', () => { harvestSettings(); state.lang = 'en'; renderSettings(); });
  const tt = $('termTerminal'), ti = $('termIterm');
  if (tt) tt.addEventListener('click', () => { harvestSettings(); state.terminalApp = 'Terminal'; renderSettings(); });
  if (ti) ti.addEventListener('click', () => { harvestSettings(); state.terminalApp = 'iTerm'; renderSettings(); });
  const save = $('prefsSave');
  if (save) save.addEventListener('click', saveSettings);
  const tc = $('testClaude');
  if (tc) tc.addEventListener('click', testClaude);
  const tm = $('testMcp');
  if (tm) tm.addEventListener('click', testMcp);
}

function setTestMsg(id, text, kind) {
  const el = $(id); if (!el) return;
  el.textContent = text || '';
  el.className = 'test-msg' + (kind === 'ok' ? ' ok' : kind === 'bad' ? ' bad' : '');
}

async function testClaude() {
  harvestSettings();
  const tr = state.lang !== 'en';
  setTestMsg('claudeTestMsg', tr ? 'Kontrol ediliyor…' : 'Checking…');
  try {
    if (!window.galaxy || !window.galaxy.claudeCheck) { setTestMsg('claudeTestMsg', tr ? 'Bu pencerede deneme yok.' : 'Test is unavailable here.', 'bad'); return; }
    const r = await window.galaxy.claudeCheck({ path: state.claudePath || '' });
    if (r && r.ok && r.path) {
      state.claudePath = r.path;
      const inp = $('setClaude'); if (inp) inp.value = r.path;
      const head = r.discovered ? (tr ? 'Otomatik bulundu' : 'Auto-detected') : (tr ? 'Bulundu' : 'Found');
      setTestMsg('claudeTestMsg', head + ' · ' + r.path + (tr ? ' — Kaydet' : ' — Save'), 'ok');
    } else setTestMsg('claudeTestMsg', (r && r.error) || (tr ? 'Claude bulunamadı. Terminalde npm install -g @anthropic-ai/claude-code, sonra Dene.' : 'Claude not found. In Terminal: npm install -g @anthropic-ai/claude-code, then Test.'), 'bad');
  } catch (e) {
    setTestMsg('claudeTestMsg', (e && e.message) || (tr ? 'denenemedi' : 'failed'), 'bad');
  }
}

async function testMcp() {
  harvestSettings();
  const tr = state.lang !== 'en';
  setTestMsg('mcpTestMsg', tr ? 'Kaydedilmiş ayarlarla deneniyor…' : 'Trying saved settings…');
  try {
    if (!window.galaxy || !window.galaxy.mcpList) { setTestMsg('mcpTestMsg', tr ? 'Bu pencerede deneme yok.' : 'Test is unavailable here.', 'bad'); return; }
    const r = await window.galaxy.mcpList();
    if (r && r.ok) {
      const names = (r.tools || []).map(t => t.name || t).filter(Boolean).slice(0, 8).join(', ');
      setTestMsg('mcpTestMsg', (tr ? 'Bağlandı' : 'Connected') + (names ? ' · ' + names : ''), 'ok');
    } else setTestMsg('mcpTestMsg', (r && r.error) || (tr ? 'Bağlanamadı. Kaydet, komutu kontrol et.' : 'Could not connect. Save, then check the command.'), 'bad');
  } catch (e) {
    setTestMsg('mcpTestMsg', (e && e.message) || (tr ? 'denenemedi' : 'failed'), 'bad');
  }
}

async function saveSettings() {
  harvestSettings();
  const btn = $('prefsSave');
  if (btn) btn.disabled = true;
  const err = $('prefsErr');
  try {
    await window.galaxy.settingsSave({
      name: state.name, lang: state.lang,
      claudePath: state.claudePath,
      terminalApp: state.terminalApp,
      sshTimeout: state.sshTimeout,
      assistantBio: state.assistantBio || '',
      mcpServers: state.mcpCommand ? [{
        id: 'mail',
        command: state.mcpCommand,
        args: (state.mcpArgs || '').split(/\s+/).filter(Boolean),
        env: (state.mcpEnv || '').split(/\r?\n/).reduce((o, line) => {
          const s = line.trim(); if (!s || s.startsWith('#')) return o;
          const i = s.indexOf('='); if (i <= 0) return o;
          o[s.slice(0, i).trim()] = s.slice(i + 1).trim(); return o;
        }, {})
      }] : [],
      mailBriefTool: state.mailBriefTool || '',
      mailSendTool: state.mailSendTool || '',
      mailTo: state.mailTo || '',
      mailListTool: state.mailListTool || '',
      mailReadTool: state.mailReadTool || '',
      uiTheme: 'apex'
    });
    window.close();
  } catch (e) {
    if (btn) btn.disabled = false;
    if (err) err.textContent = (e && e.message) || 'kaydedilemedi';
  }
}

// Tanıtım görselleri: her adım, sunumdaki karşılık gelen infografikle açılır.
// Şerit kırpılmış görünür; tıklayınca tam boy açılır.
const AST = 'assets/guide/';
const STEP_ILLUS = [
  { img: 'hero-kapak.jpg', cap: { tr: 'Klasörleri yaşayan bir evrene dönüştür', en: 'Turn folders into a living universe' } },
  { img: 'eski-yeni.jpg', cap: { tr: 'Dağınık klasörlerden otonom seyir defterine', en: 'From scattered folders to an autonomous logbook' } },
  { img: 'terminoloji.jpg', cap: { tr: 'Galaksi · Yıldız Sistemi · Gezegen', en: 'Galaxy · Star System · Planet' } },
  { img: 'gorev-murettebati.jpg', cap: { tr: 'Görev mürettebatın', en: 'Your mission crew' } },
  { img: 'kisayol-haritasi.jpg', cap: { tr: 'Bağlantılar — Claude, GitHub, posta, DB, SSH', en: 'Connections — Claude, GitHub, mail, DB, SSH' } },
  { img: 'hero-kapak.jpg', cap: { tr: 'Kısayol haritası — evrenin seni bekliyor', en: 'Shortcut map — your universe awaits' } }
];

function renderIllus(step) {
  const host = $('illusHost');
  const it = STEP_ILLUS[step];
  if (!it) { host.innerHTML = ''; return; }
  const src = AST + it.img;
  host.innerHTML = `<div class="illus" data-zoom="${src}" title="${esc(it.cap[state.lang] || it.cap.tr)}">
    <img src="${src}" alt=""><span class="zoom">BÜYÜT</span></div>`;
}

function render() {
  const t = T();
  $('hudLabel').textContent = t.hud + ' · ' + (state.step + 1) + '/6';
  renderIllus(state.step);
  $('backBtn').style.visibility = state.step === 0 ? 'hidden' : 'visible';
  $('backBtn').innerHTML = '◂ ' + t.back;
  $('nextBtn').textContent = state.step === 5 ? t.start : t.next;
  $('dots').innerHTML = [0, 1, 2, 3, 4, 5].map(i => `<div class="dot ${i === state.step ? 'on' : ''}"></div>`).join('');
  $('err').textContent = '';
  const body = $('stepBody');
  body.className = 'fade';

  if (state.step === 0) {
    $('stepSub').textContent = t.s0 + ' ' + t.s0b;
    body.innerHTML = `<div class="langCards">
      <div class="langCard ${state.lang === 'tr' ? 'sel' : ''}" onclick="setLang('tr')"
           role="button" tabindex="0" aria-pressed="${state.lang === 'tr'}"
           onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();setLang('tr')}">
        <div class="flag">🇹🇷</div><div class="name">TÜRKÇE</div></div>
      <div class="langCard ${state.lang === 'en' ? 'sel' : ''}" onclick="setLang('en')"
           role="button" tabindex="0" aria-pressed="${state.lang === 'en'}"
           onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();setLang('en')}">
        <div class="flag">🇬🇧</div><div class="name">ENGLISH</div></div>
    </div>`;
  } else if (state.step === 1) {
    $('stepSub').textContent = t.s1;
    body.innerHTML = `<div class="card" style="max-height:none">
      <input type="text" id="nameInp" placeholder="${t.s1ph}" value="${esc(state.name)}" maxlength="60">
    </div>`;
    const inp = $('nameInp');
    inp.focus();
    inp.addEventListener('input', () => { state.name = inp.value; });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') next(); });
  } else if (state.step === 2) {
    $('stepSub').textContent = t.s2;
    body.innerHTML = `<div class="card" id="uniList" style="max-height:340px;padding:16px"></div>`;
    renderUniverses();
  } else if (state.step === 3) {
    $('stepSub').textContent = t.s3;
    body.innerHTML = `<div class="card" id="agentList"></div>`;
    renderAgents();
  } else if (state.step === 4) {
    $('stepSub').textContent = t.s4;
    const cards = [
      ['cClaudeT','cClaudeB','cClaudeW'],
      ['cGhT','cGhB','cGhW'],
      ['cMailT','cMailB','cMailW'],
      ['cDbT','cDbB','cDbW'],
      ['cSshT','cSshB','cSshW'],
      ['cMicT','cMicB','cMicW']
    ].map(([a,b,w]) => `<div class="connCard"><div class="t">${t[a]}</div><div class="b">${t[b]}</div><div class="w">${t[w]}</div></div>`).join('');
    body.innerHTML = `<div class="card wide"><div class="connGrid">${cards}</div><div class="connNote">${t.kSkip ? (state.lang==='en' ? 'Nothing on this page is required to launch.' : 'Bu sayfadaki hiçbir şey kalkış için zorunlu değil.') : ''}</div></div>`;
  } else {
    $('stepSub').textContent = t.s5;
    body.innerHTML = `<div class="card" style="max-height:none">
      <div class="sumLine"><div class="k mono">${t.kName}</div><div>${esc(state.name) || t.anon}</div></div>
      <div class="sumLine"><div class="k mono">${t.kLang}</div><div>${state.lang === 'en' ? 'English' : 'Türkçe'}</div></div>
      <div class="sumLine"><div class="k mono">${t.kUni}</div><div>${state.universes.map(u => esc(u.name)).join(' · ') || '—'}</div></div>
      <div class="sumLine"><div class="k mono">${t.kAgents}</div><div>${state.agents.filter(a => a.on !== false).map(a => esc(a.name)).join(' · ')}</div></div>
      <div class="sumLine" style="border:none"><div class="k mono">${state.lang==='en'?'Later':'Sonra'}</div><div>${state.lang==='en'?'Settings → Tools / Mail · DB tab · More → SSH · Terminal: gh auth login':'Ayarlar → Araçlar / Posta · DB sekmesi · Daha → SSH · Terminal: gh auth login'}</div></div>
    </div>`;
  }
}

// Evren adından deterministik gezegen rengi (artifact "Evrenini seç" küre dili)
function planetHue(s) { let h = 0; for (let i = 0; i < (s || '').length; i++) h = (h * 31 + s.charCodeAt(i)) % 360; return h; }
function planetStyle(hue) {
  return `background:radial-gradient(circle at 38% 30%, hsl(${hue},95%,88%), hsl(${hue},78%,62%) 46%, hsl(${(hue + 14) % 360},58%,26%) 100%);`
    + `box-shadow:0 0 22px hsla(${hue},80%,60%,.45);`;
}

function renderUniverses() {
  const t = T();
  const el = $('uniList');
  const cards = state.universes.map((u, i) => {
    const hue = planetHue(u.name || u.root || String(i));
    return `<div class="uniCard">
      <div class="rm" data-x="${i}" title="Kaldır">✕</div>
      <div class="planet" style="${planetStyle(hue)}"></div>
      <input class="un" data-i="${i}" value="${esc(u.name)}" placeholder="${t.s2name}" maxlength="60">
      <div class="pth" title="${esc(u.root)}">${esc(u.root)}</div>
      <div class="st"><b>gezegenler</b> taranacak</div>
    </div>`;
  }).join('');
  const addCard = `<div class="uniCard add" id="addUni">
    <div class="plus">+</div>
    <div class="lbl">${(t.pick || '+ KLASÖR SEÇ').replace(/^\+\s*/, '')}</div>
    <div class="sub2">${state.lang === 'en' ? 'local folder' : 'yerel klasör'}</div>
  </div>`;
  el.innerHTML = `<div class="uniGrid">${cards}${addCard}</div>`;
  el.querySelectorAll('input.un').forEach(inp => inp.addEventListener('input', () => {
    state.universes[+inp.dataset.i].name = inp.value;
  }));
  el.querySelectorAll('.rm').forEach(x => x.addEventListener('click', () => {
    state.universes.splice(+x.dataset.x, 1); renderUniverses();
  }));
  const add = $('addUni');
  if (add) add.addEventListener('click', pickFolder);
}

function renderAgents() {
  const el = $('agentList');
  el.innerHTML = state.agents.map((a, i) => `
    <label class="agentRow" style="align-items:flex-start;gap:12px;cursor:pointer;opacity:${a.on === false ? '.5' : '1'}">
      <input type="checkbox" data-i="${i}" ${a.on === false ? '' : 'checked'} style="margin-top:4px;accent-color:${esc(a.color || '#61dcff')}">
      <div class="agentDot" style="background:${esc(a.color || '#61dcff')};margin-top:6px"></div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:600">${esc(a.name)} <span style="font-weight:400;opacity:.65;font-size:12px">· ${esc(a.role)}</span></div>
        ${(a.abilities || []).length ? `<ul style="margin:4px 0 0;padding-left:16px;font-size:12px;opacity:.75;line-height:1.5">${a.abilities.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
      </div>
    </label>`).join('');
  el.querySelectorAll('input[type=checkbox]').forEach(inp => inp.addEventListener('change', () => {
    state.agents[+inp.dataset.i].on = inp.checked;
    if (!state.agents.some(a => a.on !== false)) { state.agents[+inp.dataset.i].on = true; inp.checked = true; }
    renderAgents();
  }));
}

async function pickFolder() {
  try {
    const r = await window.galaxy.pickFolder();
    if (!r || !r.path) return;
    if (state.universes.some(u => u.root === r.path)) return;
    const base = r.path.split('/').pop();
    state.universes.push({ name: base, root: r.path, bookmark: r.bookmark || null });
    renderUniverses();
  } catch (e) {}
}

// Dil değişince, kullanıcı dokunmadıysa ajan rol etiketlerini de çevir
const ROLE_DEFAULTS = {
  tr: { doc: 'Dokümantasyon', forge: 'Kod Denetçisi', mentor: 'Koç' },
  en: { doc: 'Documentation', forge: 'Code Review', mentor: 'Coach' }
};
function setLang(l) {
  const prev = state.lang === 'en' ? 'en' : 'tr';
  state.lang = l;
  for (const a of state.agents) {
    const from = ROLE_DEFAULTS[prev][a.id], to = ROLE_DEFAULTS[l][a.id];
    if (from && to && a.role === from) a.role = to;
  }
  render();
}

function next() {
  const t = T();
  if (state.step === 2 && !state.universes.length) { $('err').textContent = t.errFolder; return; }
  if (state.step < 5) { state.step++; render(); return; }
  finish();
}

async function finish() {
  const t = T();
  $('nextBtn').disabled = true;
  try {
    const r = await window.galaxy.onboardComplete({
      name: state.name, lang: state.lang,
      universes: state.universes,
      agents: state.agents.map(a => ({ id: a.id, name: a.name, role: a.role, on: a.on !== false }))
    });
    if (!r || !r.ok) { $('err').textContent = (r && r.error) || t.errFolder; $('nextBtn').disabled = false; }
    // ok ise ana süreç bu pencereyi kapatır
  } catch (e) { $('nextBtn').disabled = false; }
}

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

// görsel büyütme
document.addEventListener('click', e => {
  const z = e.target.closest && e.target.closest('[data-zoom]');
  if (z) { const lb = $('lb'); lb.querySelector('img').src = z.dataset.zoom; lb.classList.add('on'); return; }
  if (e.target.closest && e.target.closest('#lb')) $('lb').classList.remove('on');
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    const lb = $('lb');
    if (lb && lb.classList.contains('on')) { lb.classList.remove('on'); return; }
    if (MODE === 'settings') { window.close(); return; }
  }
  if (MODE === 'settings' && (e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') {
    e.preventDefault(); saveSettings();
  }
});

$('nextBtn').addEventListener('click', () => { if (MODE !== 'settings') next(); });
$('backBtn').addEventListener('click', () => { if (MODE !== 'settings' && state.step > 0) { state.step--; render(); } });
window.setLang = setLang;
init();
</script>
